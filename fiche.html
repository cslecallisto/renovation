:root {
color-scheme: light;
--navy: #17324D; --navy2: #24466B; --ink: #1F2A37; --muted: #5B6776; --light: #F2F5F9; --line: #D5DCE4; --white: #FFFFFF;
--jaune: #F2C230; --sky: #C9DCF2; --ambre: #B8862F;
--s-V26: #7A4A9E; --s-V26-f: #F2EDF5; --s-VPT: #138F82; --s-VPT-f: #E7F4F3; --s-SSP: #B8862F; --s-SSP-f: #F8F3EA;
--focus: #1A6FD6;
--r: 12px; --gut: 16px; --fs: 17px;
--f-titre: "Newsreader", Georgia, "Times New Roman", serif;
--f-texte: "Public Sans", "Segoe UI", system-ui, -apple-system, Roboto, Arial, sans-serif;
}
* { box-sizing: border-box; }
html { font-size: var(--fs); -webkit-text-size-adjust: 100%; }
body { margin: 0; font-family: var(--f-texte); color: var(--ink); background: var(--white); line-height: 1.45; overflow-wrap: break-word; }
[hidden] { display: none !important; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--navy); }
h1, h2, h3 { font-family: var(--f-titre); font-weight: 600; letter-spacing: -0.005em; }
:focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; border-radius: 6px; }
.skip { position: absolute; left: 8px; top: -60px; background: var(--navy); color: #fff; padding: 10px 14px; border-radius: 8px; z-index: 50; }
.skip:focus { top: 8px; }
@media (prefers-reduced-motion: reduce) { * { transition: none !important; animation: none !important; scroll-behavior: auto !important; } }
.tab, output, .val, .gros, .valeur, .res td, .imm td { font-variant-numeric: tabular-nums; }
header.site { background: var(--navy); color: #fff; padding: 10px var(--gut) 0; }
.sur { font-size: 0.78rem; letter-spacing: 0.05em; text-transform: uppercase; color: var(--sky); }
header h1 { font-size: 1.6rem; line-height: 1.2; margin: 4px 0 10px; color: #fff; }
nav.etapes { display: flex; gap: 4px; border-bottom: 4px solid var(--jaune); }
nav.etapes > * { flex: 1 1 0; min-width: 0; min-height: 48px; background: transparent; border: 0; border-radius: 10px 10px 0 0; color: var(--sky); padding: 8px 6px; text-align: left; display: flex; align-items: center; gap: 6px; font-size: 0.95rem; line-height: 1.15; text-decoration: none; }
nav.etapes .num { flex: 0 0 auto; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; border: 2px solid var(--sky); font-weight: 700; font-size: 0.9rem; }
nav.etapes .lg { display: none; }
nav.etapes [aria-current="step"] { background: #fff; color: var(--navy); font-weight: 700; }
nav.etapes [aria-current="step"] .num { background: var(--navy); color: #fff; border-color: var(--navy); }
nav.etapes .fait .num { background: var(--jaune); color: var(--navy); border-color: var(--jaune); }
nav.etapes > *:focus-visible { outline-offset: -3px; }
@media (max-width: 599px) { nav.etapes > * { flex-direction: column; align-items: center; gap: 3px; padding: 6px 2px; font-size: 0.88rem; text-align: center; } }
.avert { background: #FFF8E1; border-bottom: 1px solid #F0DFA0; color: var(--ink); font-size: 0.92rem; padding: 8px var(--gut); }
.avert p { margin: 0; }
.avert a.lien-avert { color: var(--navy); font-weight: 600; display: inline-block; padding: 12px 0; margin: -12px 0; }
.banniere { background: var(--light); border-bottom: 2px solid var(--jaune); color: var(--ink); font-size: 0.95rem; padding: 12px var(--gut); }
.banniere .in { max-width: 1120px; margin: 0 auto; }
.banniere h2 { font-size: 1.15rem; margin: 0 0 6px; color: var(--navy); }
.banniere p { margin: 0 0 6px; }
.banniere ul { margin: 0 0 8px; padding-left: 20px; }
.banniere .btn { margin-top: 4px; width: auto; }
.resume { position: sticky; top: 0; z-index: 20; background: #fff; border-bottom: 1px solid var(--line); padding: 6px var(--gut); }
.resume .in { display: flex; gap: 8px; align-items: center; }
.resume .txt { flex: 1; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; font-size: 0.92rem; }
.chip { display: inline-block; background: var(--light); border: 1px solid var(--line); border-radius: 999px; padding: 2px 10px; font-size: 0.88rem; color: var(--navy); font-weight: 700; margin-right: 6px; }
.resume button { min-height: 44px; border: 1.5px solid var(--navy); background: #fff; color: var(--navy); border-radius: 999px; padding: 0 14px; font-weight: 600; white-space: nowrap; }
main { padding: 0 var(--gut) 40px; max-width: 1120px; margin: 0 auto; }
section.temps { padding-top: 18px; }
h2 { font-size: 1.45rem; line-height: 1.25; margin: 0 0 6px; color: var(--navy); }
h3 { font-size: 1.15rem; margin: 0 0 8px; color: var(--navy); }
.chapeau { color: var(--muted); margin: 0 0 16px; font-size: 1rem; }
.carte { background: #fff; border: 1px solid var(--line); border-radius: var(--r); padding: 16px; margin: 0 0 14px; box-shadow: 0 1px 2px rgba(23, 50, 77, 0.05); min-width: 0; }
.carte.light { background: var(--light); border-color: transparent; }
.num { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%; background: var(--navy); color: #fff; font-size: 0.85rem; margin-right: 8px; vertical-align: middle; flex: 0 0 26px; font-family: var(--f-texte); }
p { margin: 0 0 10px; }
small, .note { font-size: 0.9rem; color: var(--muted); }
.aide { font-size: 0.95rem; color: var(--muted); margin: 6px 0 0; }
.lien { background: none; border: 0; padding: 10px 6px; margin: -6px -6px; color: var(--navy); text-decoration: underline; font-weight: 600; min-height: 44px; text-align: left; font-family: inherit; display: inline-block; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 48px; padding: 10px 18px; border-radius: 10px; border: 2px solid var(--navy); background: var(--navy); color: #fff; font-weight: 700; text-decoration: none; width: 100%; text-align: center; }
.btn.sec { background: #fff; color: var(--navy); }
.actions { margin-top: 12px; display: flex; flex-wrap: wrap; gap: 10px; }
.badge { display: inline-block; background: var(--jaune); color: var(--navy); border-radius: 999px; padding: 1px 8px; font-size: 0.8rem; font-weight: 700; margin-left: 6px; vertical-align: middle; }
.lib-champ { display: block; margin-bottom: 4px; }
input[type=text], input:not([type]), select { width: 100%; min-height: 44px; margin-top: 4px; border: 2px solid var(--line); border-radius: 8px; padding: 6px 10px; background: #fff; }
.grille { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin: 8px 0; }
.choix { position: relative; }
.choix input { position: absolute; opacity: 0; width: 100%; height: 100%; inset: 0; margin: 0; cursor: pointer; }
.choix label { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; min-height: 64px; padding: 10px 12px; border: 2px solid var(--line); border-radius: 10px; background: #fff; }
.choix label b { font-size: 1.2rem; color: var(--navy); }
.choix label span { font-size: 0.88rem; color: var(--muted); }
.choix input:checked + label { border-color: var(--navy); background: var(--navy); }
.choix input:checked + label b, .choix input:checked + label span { color: #fff; }
.choix input:focus-visible + label { outline: 3px solid var(--focus); outline-offset: 2px; }
.grille.lots { grid-template-columns: 1fr; }
.grille.lots label b { font-size: 1.05rem; }
.choisi { background: var(--light); border-left: 4px solid var(--jaune); padding: 8px 12px; border-radius: 0 8px 8px 0; margin-top: 10px; }
.choisi .lien { margin-left: 6px; }
.seg { display: flex; border: 2px solid var(--navy); border-radius: 10px; overflow: hidden; margin: 6px 0; }
.seg button { flex: 1; min-height: 46px; border: 0; background: #fff; color: var(--navy); font-weight: 600; padding: 6px 10px; min-width: 0; }
.seg button + button { border-left: 2px solid var(--navy); }
.seg button[aria-pressed="true"] { background: var(--navy); color: #fff; }
.seg.v { flex-direction: column; }
.seg.v button + button { border-left: 0; border-top: 2px solid var(--navy); }
.seg.petit button { min-height: 44px; min-width: 44px; padding: 6px 4px; }
@media (max-width: 599px) { .deux.entree { grid-template-columns: 1fr; } }
.seg.trois { flex-direction: column; }
.seg.trois button + button { border-left: 0; border-top: 2px solid var(--navy); }
.seg.trois button { min-height: 48px; }
@media (min-width: 600px) { .seg.trois { flex-direction: row; } .seg.trois button + button { border-top: 0; border-left: 2px solid var(--navy); } }
.glisse { margin: 8px 0 2px; }
.glisse input[type=range] { width: 100%; height: 44px; accent-color: var(--navy); margin: 0; }
.glisse .bornes { display: flex; justify-content: space-between; gap: 8px; font-size: 0.85rem; color: var(--muted); }
.glisse .valeur { font-weight: 700; color: var(--navy); }
.repart { display: flex; height: 12px; border-radius: 6px; overflow: hidden; background: #E4E8EE; margin: 6px 0 2px; }
.repart i { display: block; height: 100%; }
#rep-comptant { background: var(--navy); } #rep-credit { background: #9CC3E8; }
.reglages { display: grid; grid-template-columns: minmax(0, 1fr); gap: 10px; margin: 0 0 16px; }
.regl { border: 1px solid var(--line); border-radius: var(--r); padding: 12px 14px; background: #fff; min-width: 0; }
.regl .tete { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; flex-wrap: wrap; }
.regl .tete b { color: var(--navy); }
.regl .defaut { font-size: 0.88rem; color: var(--muted); }
.regl .effet { font-size: 0.95rem; margin: 6px 0 0; color: var(--ink); }
.regl .effet output { font-weight: 700; color: var(--navy); }
.options label { display: flex; gap: 10px; align-items: flex-start; padding: 8px 0; border-top: 1px solid var(--line); min-height: 44px; }
.options label:first-of-type { border-top: 0; }
.options input { width: 24px; height: 24px; flex: 0 0 24px; margin: 2px 0 0; accent-color: var(--navy); }
.options .lib { flex: 1; min-width: 0; }
.options .lib small { display: block; }
.options .plus { font-weight: 700; color: var(--navy); white-space: nowrap; }
.options label select { width: auto; min-width: 9em; margin: 0; align-self: center; }

  }
  function choisir(o, cles) {
    const r = {};
    for (const k of cles) r[k] = o[k];
    return r;
  }
  function borne01(x) {
    return Math.min(1.0, Math.max(0.0, nombre(x)));
  }

  // ============================================================================
  // 1. VUE DU CONTRAT : accès uniformes aux blocs, restauration de précision
  // ============================================================================
  //
  // Le contrat exporté (`simulateur_v2_data.json`) recopie les blocs de params_v2.json sous
  // d'autres clés (`horizon` -> `meta`, `programme.lots` -> `lots`, `avp` -> `avp_reperes`,
  // `immobilier` -> `typologies`, `financement.config_defaut` -> `meta.config_defaut`). La vue
  // uniformise ces accès ; elle est construite une seule fois par objet `p` (cache WeakMap) et
  // ne modifie jamais `p`.
  //
  // Restauration de précision (voir README, « bug d'export ») : les exports Python antérieurs au
  // 23/09 07:39 arrondissaient AUSSI les paramètres (6 décimales sous 10, 2 décimales au-delà), ce
  // qui altérait trois paramètres utilisés par le moteur alors que le bloc `precalcul` avait été
  // calculé avec les valeurs exactes. L'export est corrigé depuis (blocs de paramètres exportés tels
  // quels) : le garde-fou reste en place, sans effet sur un contrat exact (`precision` vide).
  // Les trois se recalculent exactement (mêmes opérations IEEE que build_params_v2.py) depuis
  // des ancres entières présentes dans le contrat :
  //   energie.conso_gaz_mwh_an           = charges.gaz_2025_kwh / 1000            (ged2025.p10.gaz_kwh)
  //   energie.gain_facture.k_base_par_mwh     = ancre_sc2 / mwh_sc2               (_sources : derive:ancre_sc2 / mwh_sc2)
  //   energie.gain_facture.k_marginal_par_mwh = (ancre_sc3 - ancre_sc2) / mwh_sc3_supplement
  // La restauration n'est appliquée que si la valeur exacte ne diffère de la valeur exportée que
  // par l'arrondi d'export (sinon la valeur du contrat est conservée) ; chaque restauration est
  // journalisée dans `vue.precision` (rien n'est déplacé en silence).

  const VUES = new WeakMap();

  function vue(p) {
    if (p && p.__moteur_v2_vue) return p;
    if (!p || typeof p !== "object") throw new Error("moteur_v2 : paramètres absents");
    let v = VUES.get(p);
    if (!v) {
      v = construireVue(p);
      VUES.set(p, v);
    }
    return v;
  }

  function restaurerPrecision(p, journal) {
    const e = p.energie;
    if (!e) return e;
    const energie = Object.assign({}, e);
    // ged2025.p10.gaz_kwh -> cs.conso_gaz_canon_mwh (build_params_v2.py : assert gaz_kwh / 1000 = conso)
    const kwh = p.charges ? p.charges.gaz_2025_kwh : undefined;
    if (typeof kwh === "number" && typeof e.conso_gaz_mwh_an === "number") {
      const exact = kwh / 1000;
      if (exact !== e.conso_gaz_mwh_an && Math.abs(exact - e.conso_gaz_mwh_an) <= 0.005 + 1e-9) {
        journal.push({ cle: "energie.conso_gaz_mwh_an", exporte: e.conso_gaz_mwh_an, restaure: exact, regle: "charges.gaz_2025_kwh / 1000" });
        energie.conso_gaz_mwh_an = exact;
      }
    }
    if (e.gain_facture) {
      const gf = Object.assign({}, e.gain_facture);
      // derive:ancre_sc2 / mwh_sc2
      if (typeof gf.ancre_sc2 === "number" && typeof gf.mwh_sc2 === "number" && gf.mwh_sc2 && typeof gf.k_base_par_mwh === "number") {
        const exact = gf.ancre_sc2 / gf.mwh_sc2;
        if (exact !== gf.k_base_par_mwh && Math.abs(exact - gf.k_base_par_mwh) <= 0.5e-6 + 1e-12) {
          journal.push({ cle: "energie.gain_facture.k_base_par_mwh", exporte: gf.k_base_par_mwh, restaure: exact, regle: "ancre_sc2 / mwh_sc2" });
          gf.k_base_par_mwh = exact;
        }
      }
      // derive:(ancre_sc3 - ancre_sc2) / mwh_sc3_supplement
      if (typeof gf.ancre_sc3 === "number" && typeof gf.ancre_sc2 === "number" && typeof gf.mwh_sc3_supplement === "number" && gf.mwh_sc3_supplement && typeof gf.k_marginal_par_mwh === "number") {
        const exact = (gf.ancre_sc3 - gf.ancre_sc2) / gf.mwh_sc3_supplement;
        if (exact !== gf.k_marginal_par_mwh && Math.abs(exact - gf.k_marginal_par_mwh) <= 0.5e-6 + 1e-12) {
          journal.push({ cle: "energie.gain_facture.k_marginal_par_mwh", exporte: gf.k_marginal_par_mwh, restaure: exact, regle: "(ancre_sc3 - ancre_sc2) / mwh_sc3_supplement" });
          gf.k_marginal_par_mwh = exact;
        }
      }
      energie.gain_facture = gf;
    }
    return energie;
  }

  function construireVue(p) {
    const contrat = has(p, "meta") && has(p, "lots");
    const brut = has(p, "horizon") && has(p, "programme") && has(p.programme, "lots");
    if (!contrat && !brut) {
      throw new Error("moteur_v2 : format de paramètres inconnu (contrat exporté simulateur_v2_data.json ou params_v2.json attendu)");
    }
    const precision = [];
    const energie = restaurerPrecision(p, precision);
    return {
      __moteur_v2_vue: true,
      format: contrat ? "contrat" : "params_v2",
      // hypothese_cs:horizon_30_decision_14_07_2026 ; hypothese_cs:kpi_25_ans_mission_v2
      H: entier(contrat ? p.meta.horizon_ans : p.horizon.annees),
      Hk: entier(contrat ? p.meta.horizon_kpi_ans : p.horizon.kpi_annees),
      lots: contrat ? p.lots : p.programme.lots,
      programme: p.programme,
      avp: contrat ? p.avp_reperes : p.avp,
      immobilier: contrat ? p.typologies : p.immobilier,
      configDefautBrut: contrat ? p.meta.config_defaut : p.financement.config_defaut,
      energie: energie,
      aides: p.aides,
      calendriers: p.calendriers,
      financement: p.financement,
      charges: p.charges,
      situations: p.situations,
      gestes: p.gestes_individuels,
      precalcul: has(p, "precalcul") ? p.precalcul : null,
      precision: precision,
      source: p,
    };
  }

  /** Vue normalisée du contrat (construite une fois par objet, sans le modifier). */
  function preparer(p) {
    return vue(p);
  }

  /** Oublie la vue cachée d'un objet `p` (à appeler si l'hôte a modifié `p` en place : horizon,
   *  bloc énergie...) et la reconstruit. Les autres blocs sont lus par référence et suivent `p`. */
  function rafraichir(p) {
    if (p && p.__moteur_v2_vue) return p;
    VUES.delete(p);
    return vue(p);
  }

  // ============================================================================
  // 2. OUTILS FINANCIERS ET IMMOBILIERS (section 1 du Python)
  // ============================================================================

  /** Paiement constant par période : periodicite 12 (mensuel) ou 1 (annuel). */
  function paiementPeriodique(capital, taux, nPeriodes, periodicite) {
    if (nPeriodes <= 0 || capital <= 0) return 0.0;
    const r = taux / periodicite;
    if (r === 0) return capital / nPeriodes;
    return capital * r / (1 - Math.pow(1 + r, -nPeriodes));
  }

  /** Capital restant dû après k paiements (amortissement constant classique). */
  function crdApres(capital, taux, nPeriodes, k, periodicite) {
    if (k >= nPeriodes || capital <= 0) return 0.0;
    if (k < 0) k = 0;
    const r = taux / periodicite;
    if (r === 0) return capital * (nPeriodes - k) / nPeriodes;
    return capital * (Math.pow(1 + r, nPeriodes) - Math.pow(1 + r, k)) / (Math.pow(1 + r, nPeriodes) - 1);
  }

  function quotePart(p, typo) {
    const P = vue(p);
    // qp.p1.tantiemes / qp.p1.total_tantiemes
    const t = P.immobilier.typologies[typo];
    return t.tantiemes / P.immobilier.total_tantiemes_logements;
  }

  function valeurLot(p, typo) {
    const P = vue(p);
    // cs.typologies (surface_m2, prix_eur_m2)
    const t = P.immobilier.typologies[typo];
    return t.surface_m2 * t.prix_eur_m2;
  }

  function basePatrimoine(p) {
    const P = vue(p);
    let s = 0;
    // cs.typologies (nb_lots)
    for (const typo of Object.keys(P.immobilier.typologies)) {
      s += P.immobilier.typologies[typo].nb_lots * valeurLot(P, typo);
    }
    return s;
  }

  function horizon(p) {
    return vue(p).H;
  }

  function typologies(p) {
    return Object.keys(vue(p).immobilier.typologies);
  }

  // ============================================================================
  // 3. PROGRAMME : lots, règle d'échange, prix, capex (section 2 du Python)
  // ============================================================================

  function lots(p) {
    return vue(p).lots;
  }

  /** Ordre du catalogue : base, options, puis lots retirés du programme (jamais proposés à l'écran,
   *  gardés pour recomposer les scénarios historiques de l'AVP ; décision du CS rapportée le 27/09/2026). */
  function ordreLots(p) {
    const P = vue(p);
    return P.programme.ordre_base.concat(P.programme.ordre_options, P.programme.ordre_retires || []);
  }

  function lotsVerrouilles(p) {
    return vue(p).programme.regles.verrouilles.slice();
  }

  function compositionDefaut(p) {
    return vue(p).programme.compositions_reference.PROGRAMME.slice();   /* base soumise au vote : RAO p. 32 (occultations en base, toiture en option) */
  }

  function compositionReference(p, nom) {
    return vue(p).programme.compositions_reference[nom].slice();
  }

  /** Composition canonique : verrouillés présents, suiveurs (P13b avec P13a, P6b avec P6a)
   *  alignés, ordre du catalogue ; les ids inconnus sont ignorés. */
  function normaliserComposition(p, sel) {
    const P = vue(p);
    const regles = P.programme.regles;
    const s = new Set();
    for (const x of (sel || [])) {
      if (has(P.lots, x)) s.add(x);
    }
    for (const x of regles.verrouilles) s.add(x);
    for (const suiveur of Object.keys(regles.suit)) {
      const maitre = regles.suit[suiveur];
      if (s.has(maitre)) s.add(suiveur);
      else s.delete(suiveur);
    }
    return ordreLots(P).filter((x) => s.has(x));
  }

  /** Règle d'échange (SPEC 1.1) : au moins la toiture ou les occultations ; V1 et V2 vélos
   *  exclusifs ; lots verrouillés présents ; suiveurs cohérents. Retourne {valide, erreurs}. */
  function compositionValide(p, sel) {
    const P = vue(p);
    const regles = P.programme.regles;
    const s = new Set(sel || []);
    const erreurs = [];
    const inconnus = Array.from(s).filter((x) => !has(P.lots, x)).sort();
    if (inconnus.length) erreurs.push("lots inconnus : " + inconnus.join(", "));
    if (!regles.au_moins_un_de.some((x) => s.has(x))) erreurs.push(regles.message_regle);
    for (const groupe of regles.exclusifs) {
      if (groupe.every((x) => s.has(x))) erreurs.push("options exclusives cochées ensemble : " + groupe.join(" et "));
    }
    const manquants = regles.verrouilles.filter((x) => !s.has(x));
    if (manquants.length) erreurs.push("lots de base verrouillés absents : " + manquants.join(", "));
    for (const suiveur of Object.keys(regles.suit)) {
      const maitre = regles.suit[suiveur];
      if (s.has(suiveur) !== s.has(maitre)) erreurs.push(suiveur + " doit suivre " + maitre);
    }
    return { valide: erreurs.length === 0, erreurs: erreurs };
  }

  /** Montant TTC avant coefficients d'un lot selon la source de prix ('avp' ou 'rao'), avec repli.
   *  Retourne {montant, source_effective, repli, question, entreprise}. */
  function prixLot(p, lotId, source) {
    const P = vue(p);
    if (source === undefined) source = "rao";
    // lots.<id>.montant_avp (avp.pNNN.*_ttc) ; lots.<id>.montant_rao (rao.pNN.lotN.*_ttc)
    const lot = P.lots[lotId];
    const avp = lot.montant_avp;
    const rao = lot.montant_rao;
    if (source === "avp") {
      if (!estNul(avp)) {
        return { montant: nombre(avp), source_effective: "avp", repli: false, question: !!lot.question, entreprise: null };
      }
      return { montant: nombre(rao || 0.0), source_effective: "rao (repli : non chiffré à l'AVP)", repli: true, question: !!lot.question, entreprise: lot.entreprise };
    }
    if (source === "rao") {
      if (!estNul(rao)) {
        return { montant: nombre(rao), source_effective: "rao", repli: false, question: !!lot.question, entreprise: lot.entreprise };
      }
      return { montant: nombre(avp || 0.0), source_effective: "avp (repli : composant non isolé dans le RAO)", repli: true, question: !!lot.question, entreprise: null };
    }
    if (source === "odj") {
      // chantier ODJ (21/10/2026) : projet de convocation ; repli sur le RAO puis l'AVP pour les composants non isolés
      const odj = lot.montant_odj;
      if (!estNul(odj)) {
        return { montant: nombre(odj), source_effective: "odj", repli: false, question: !!lot.question, entreprise: (lot.entreprise_odj === undefined ? null : lot.entreprise_odj) };
      }
      const r = prixLot(P, lotId, "rao");
      r.source_effective = r.source_effective + " (repli : non inscrit tel quel à l'ordre du jour)";
      r.repli = true;
      return r;
    }
    throw new Error("source de prix inconnue : " + String(source));
  }

  /** Convention de la convocation (aléas exempts, coûts associés en grille, clés) ; null hors source « odj ». */
  function conventionOdj(p) {
    const P = vue(p);
    return P.programme.convention_odj ? P.programme.convention_odj : null;
  }

  /** Coûts associés de la convocation : fixes + taux variable x montant TTC avec aléas (rés. 21 à 25). */
  function coutsAssociesOdj(p, montantAvecAleas) {
    const ca = conventionOdj(p).couts_associes;
    return montantAvecAleas > 0 ? nombre(ca.fixes_ttc) + nombre(ca.taux_variable) * montantAvecAleas : 0.0;
  }

  function clesTantiemes(p) {
    const P = vue(p);
    return P.immobilier.cles ? P.immobilier.cles : null;
  }

  /** Part d'un logement sur une clé de charges du règlement (générales, habitation, chauffage) ; clé unique sinon. */
  function quotePartCle(p, typo, cle) {
    const P = vue(p);
    const c = clesTantiemes(P);
    if (!c || !has(c.totaux, cle)) return quotePart(P, typo);
    return nombre(c.typologies[typo][cle]) / nombre(c.totaux[cle]);
  }

  /** Quote-part d'un logement sur le programme : pondération des clés par les montants (source « odj »), sinon la clé unique. */
  function quotePartProgramme(p, typo, cap) {
    const P = vue(p);
    const parCle = cap ? cap.par_cle : null;
    if (!parCle || !cap.ttc_exact) return quotePart(P, typo);
    let tot = 0.0;
    for (const k of Object.keys(parCle)) tot += parCle[k];
    if (tot <= 0) return quotePart(P, typo);
    let s = 0.0;
    for (const k of Object.keys(parCle)) s += parCle[k] * quotePartCle(P, typo, k);
    return s / tot;
  }

  function coefficients(p) {
    // cs.aleas_chantier ; cs.honoraires_moe
    const c = vue(p).programme.coefficients;
    return { ca: 1 + nombre(c.aleas), ch: 1 + nombre(c.honoraires) };
  }

  /** Coût du programme : somme des lots cochés x (1 + aléas) x (1 + honoraires) ; `perimetre_isole`
   *  = lots isolés dans la source (sans repli) ; `ttc` arrondi à l'euro (arrondiJs). */
  function capexProgramme(p, sel, source) {
    const P = vue(p);
    if (source === undefined) source = "rao";
    const co = coefficients(P);
    const ca = co.ca, ch = co.ch;
    const detail = {};
    const replis = [], questions = [];
    let total = 0.0, isole = 0.0;
    const conv = source === "odj" ? conventionOdj(P) : null;
    const exempts = conv ? conv.aleas_exempts : [];
    let sansAleas = 0.0;
    const parCleNu = {};
    for (const lotId of (sel || [])) {
      if (!has(P.lots, lotId)) continue;
      const m = prixLot(P, lotId, source);
      detail[lotId] = m.montant;
      total += m.montant;
      if (m.repli) replis.push(lotId);
      else isole += m.montant;
      if (m.question) questions.push(lotId);
      const exempt = exempts.indexOf(lotId) >= 0;
      if (exempt) sansAleas += m.montant;
      if (conv) {
        const cle = P.lots[lotId].cle ? P.lots[lotId].cle : "generales";
        parCleNu[cle] = (has(parCleNu, cle) ? parCleNu[cle] : 0.0) + m.montant * (exempt ? 1.0 : ca);
      }
    }
    if (conv) {
      // chantier ODJ : aléas hors désamiantage ; coûts associés = fixes + taux x (montant avec aléas) ; les fixes en charges générales
      const avec = (total - sansAleas) * ca + sansAleas;
      const couts = coutsAssociesOdj(P, avec);
      const taux = nombre(conv.couts_associes.taux_variable);
      const parCle = {};
      for (const k of Object.keys(parCleNu)) parCle[k] = parCleNu[k] * (1 + taux);
      if (avec > 0) parCle.generales = (has(parCle, "generales") ? parCle.generales : 0.0) + nombre(conv.couts_associes.fixes_ttc);
      return {
        source: source, avant_aleas: total, perimetre_isole: isole, dont_replis: total - isole,
        avec_aleas: avec, honoraires: couts, ttc_exact: avec + couts, ttc: arrondiJs(avec + couts),
        detail: detail, replis: replis, questions: questions, par_cle: parCle, convention: "odj",
      };
    }
    return {
      source: source, avant_aleas: total, perimetre_isole: isole, dont_replis: total - isole,
      avec_aleas: total * ca, honoraires: total * ca * (ch - 1), ttc_exact: total * ca * ch,
      ttc: arrondiJs(total * ca * ch), detail: detail, replis: replis, questions: questions,
    };
  }

  /** Prix d'un poste AVP recomposé depuis ses lots (pont poste -> lots), à la source donnée. */
  function prixPosteAvp(p, posteId, source) {
    const P = vue(p);
    let s = 0;
    for (const lid of Object.keys(P.lots)) {
      if (P.lots[lid].poste_avp_parent === posteId) s += prixLot(P, lid, source).montant;
    }
    return s;
  }

  /** Coût d'un scénario de l'AVP recomposé depuis ses postes (repères, AVP p. 130 ; OPERENE p. 4). */
  function capexScenarioAvp(p, nom) {
    const P = vue(p);
    const co = coefficients(P);
    // avp_reperes.postes.<n>.prix_ttc (avp.p123 à p127) ; avp_reperes.scenarios (avp.p130.composition)
    const postes = P.avp.postes;
    let s = 0;
    for (const i of P.avp.scenarios[nom]) s += nombre(postes[String(i)].prix_ttc);
    return { somme_postes: s, avec_aleas: s * co.ca, avec_honoraires: s * co.ca * co.ch };
  }

  // ============================================================================
  // 4. ÉNERGIE : gain de facture, Cep, prix du gaz, factures (section 3 du Python)
  // ============================================================================

  /** Contribution d'un lot au gain de facture gaz : MWh AVP x facteur de normalisation
   *  (k_base pour les lots de SC2, k_marginal pour occultations et robinets). */
  function gainFactureLot(p, lotId) {
    const P = vue(p);
    // energie.gain_facture : lots_sc2, lots_sc3_supplement, k_base_par_mwh (derive:ancre_sc2 / mwh_sc2),
    // k_marginal_par_mwh (derive:(ancre_sc3 - ancre_sc2) / mwh_sc3_supplement) ; lots.<id>.mwh_avp (avp.p123 à p127)
    const g = P.energie.gain_facture;
    const lot = prop(P.lots, lotId);
    if (!lot || !lot.mwh_avp) return 0.0;
    if (g.lots_sc2.indexOf(lotId) >= 0) return lot.mwh_avp * g.k_base_par_mwh;
    if (g.lots_sc3_supplement.indexOf(lotId) >= 0) return lot.mwh_avp * g.k_marginal_par_mwh;
    return 0.0;
  }

  /** Gain de facture gaz d'une composition (0 à 0,59). */
  function gainFactureComposition(p, sel) {
    const P = vue(p);
    let s = 0;
    for (const x of (sel || [])) s += gainFactureLot(P, x);
    return s;
  }

  /** Gain en énergie primaire (%) d'une composition et Cep projeté (modèle par lot, à certifier BET). */
  function gainCep(p, sel) {
    const P = vue(p);
    // energie.cep.contribution_cep (hypothese_cs:cep_contribution_thermicien_23_07) ; energie.cep.cep_initial (avp.p124.etat_initial_cep)
    const cep = P.energie.cep;
    const contrib = cep.contribution_cep;
    let g = 0.0;
    for (const x of (sel || [])) g += Math.max(0.0, nombre(prop(contrib, x) || 0));
    g = arrondiJs(g * 10) / 10.0;
    const cepProj = arrondiJs(nombre(cep.cep_initial) * (1 - g / 100.0) * 10) / 10.0;
    return { gain: g, cep_proj: cepProj };
  }

  function classeDpe(p, cepVal) {
    // energie.cep.etiquettes_dpe (reglementaire:classes_dpe_energie_primaire)
    const etq = vue(p).energie.cep.etiquettes_dpe;
    for (const lb of etq.bornes) {
      if (cepVal <= lb[1]) return lb[0];
    }
    return etq.au_dela;
  }

  /** Sous-ensemble des lots à contribution Cep positive (ossature énergétique), trié. */
  function lotsEnergie(p, sel) {
    const contrib = vue(p).energie.cep.contribution_cep;
    return (sel || []).filter((x) => nombre(prop(contrib, x) || 0) > 0).sort();
  }

  /** Si l'ossature énergétique de la composition est exactement celle d'une ancre AVP / MOE,
   *  renvoie {nom, ancre} ; sinon null. */
  function ancreCep(p, sel) {
    const P = vue(p);
    // energie.cep.ancres_lots ; energie.cep.ancres_avp (avp.p124.sc1_gain_pct, avp.p126.sc2_gain_pct,
    // mail.20260504.moe.sc2_sans_toiture_pct, avp.p128.sc3_gain_pct)
    const cep = P.energie.cep;
    const le = lotsEnergie(P, sel);
    for (const nom of Object.keys(cep.ancres_lots)) {
      const la = cep.ancres_lots[nom].slice().sort();
      if (la.length === le.length && la.every((x, i) => x === le[i])) {
        return { nom: nom, ancre: cep.ancres_avp[nom] };
      }
    }
    return null;
  }

  /** Gain Cep affiché : ancre certifiée si la composition en est une, sinon le modèle par lot badgé BET. */
  function gainCepAffiche(p, sel) {
    const P = vue(p);
    const modele = gainCep(P, sel);
    const anc = ancreCep(P, sel);
    // avp.p124.etat_initial_cep
    const cep0 = nombre(P.energie.cep.cep_initial);
    if (anc) {
      const nom = anc.nom, a = anc.ancre;
      const g = nombre(a.gain_ep_pct);
      const cepProj = !estNul(a.cep_proj) ? nombre(a.cep_proj) : arrondiJs(cep0 * (1 - g / 100.0) * 10) / 10.0;
      return { gain: g, cep_proj: cepProj, certifie: true, ancre: nom, modele: modele, classe: classeDpe(P, cepProj), badge: "gain certifié (ancre " + nom + ")" };
    }
    return { gain: modele.gain, cep_proj: modele.cep_proj, certifie: false, ancre: null, modele: modele, classe: classeDpe(P, modele.cep_proj), badge: "estimation, à certifier par le BET" };
  }

  function verdictSeuil(p, gain, certifie) {
    // energie.cep.verdict_seuil : seuil_pct (operene.p3.mpr_seuil_pct), bande_pct (hypothese_cs:bande_incertitude_3_pts)
    const v = vue(p).energie.cep.verdict_seuil;
    const seuil = nombre(v.seuil_pct), bande = nombre(v.bande_pct);
    if (certifie) {
      return { mot: gain >= seuil ? "franchit le seuil" : "non franchi", cls: gain >= seuil ? "ok" : "no" };
    }
    if (gain >= seuil + bande) return { mot: "franchit (marge modérée, à confirmer BET)", cls: "ok" };
    if (gain >= seuil - bande) return { mot: "au seuil, à confirmer BET", cls: "mid" };
    return { mot: "non franchi", cls: "no" };
  }

  function choisirPrixGaz(p, variante) {
    // energie.prix_gaz_variantes (R1 : avp.p123.prix_gaz_eur_mwh + cs.gaz.indexation_pct_an ;
    // R2 : endesa.calc.variable_ttc_eur_mwh, endesa.calc.fixes_ttc_eur_an, endesa.p3.periode puis cs.gaz.reprise_apres_contrat_eur_mwh)
    const v = vue(p).energie.prix_gaz_variantes;
    return v[variante || v.defaut];
  }

  /** {variable (euros/MWh), fixes (euros/an)} de l'année : contrat puis indexation. */
  function prixGazAnnee(prixGaz, annee) {
    const mode = prixGaz.mode;
    if (mode === "indexe") {
      return { variable: prixGaz.base_eur_mwh * Math.pow(1 + prixGaz.inflation_an, annee - 1), fixes: has(prixGaz, "fixes_eur_an") ? prixGaz.fixes_eur_an : 0.0 };
    }
    if (mode === "contrat_puis_indexe") {
      const c = prixGaz.contrat;
      if (annee <= c.duree_ans) return { variable: c.prix_variable_eur_mwh, fixes: c.fixes_eur_an };
      const r = prixGaz.reprise;
      return { variable: r.base_eur_mwh * Math.pow(1 + r.inflation_an, annee - 1), fixes: has(r, "fixes_eur_an") ? r.fixes_eur_an : 0.0 };
    }
    throw new Error("mode de prix gaz inconnu : " + String(mode));
  }

  /** Facture gaz TTC collective de l'année : conso x (1 - gain) x variable + fixes. */
  function factureGaz(p, gain, annee, prixGaz) {
    const P = vue(p);
    const vf = prixGazAnnee(prixGaz, annee);
    // cs.conso_gaz_canon_mwh (= ged2025.p10.gaz_kwh / 1000)
    return P.energie.conso_gaz_mwh_an * (1 - gain) * vf.variable + vf.fixes;
  }

  function prixElec(p, annee) {
    // energie.electricite : prix_eur_mwh (cs.elec.prix_eur_kwh), inflation_an (hypothese_cs:inflation_elec_3pct_classeur)
    const e = vue(p).energie.electricite;
    return e.prix_eur_mwh * Math.pow(1 + e.inflation_an, annee - 1);
  }

  // ============================================================================
  // 5. AIDES : réactives sur assiette, éco-PTZ par actions, CEE par geste (section 4 du Python)
  // ============================================================================

  function ceeInterpole(p, mwh) {
    // aides.reactives.cee_interp (operene.p5.cee) ; aides.reactives.cee_mwh_anchors (derive : MWh AVP de SC2 et SC3)
    const ar = vue(p).aides.reactives;
    const bas = nombre(ar.cee_interp[0]), haut = nombre(ar.cee_interp[1]);
    const m2 = nombre(ar.cee_mwh_anchors[0]), m3 = nombre(ar.cee_mwh_anchors[1]);
    if (mwh <= m2) return Math.trunc(bas);
    if (mwh >= m3) return Math.trunc(haut);
    return arrondiJs(bas + (mwh - m2) * (haut - bas) / (m3 - m2));
  }

  /** Assiette MPR (avant k) d'un lot : ligne mère AVP ; au prix RAO, mise à l'échelle du poste parent. */
  function assietteNuLot(p, lotId, source) {
    const P = vue(p);
    // lots.<id>.mpr_assiette_nu (ligne mère AVP, avp.pNNN.*_ttc) ; lots.<id>.poste_avp_parent
    const lot = P.lots[lotId];
    const nu = nombre(lot.mpr_assiette_nu || 0);
    if (!nu || source === "avp") return nu;
    const parent = lot.poste_avp_parent;
    const refAvp = prixPosteAvp(P, parent, "avp");
    if (!refAvp) return nu;
    return nu * prixPosteAvp(P, parent, "rao") / refAvp;
  }

  /** Aides collectives ESTIMÉES d'une composition (formule du 23/07) : MPR travaux = taux(gain EP) x
   *  assiette (k x lignes mères, part hiver du cluster BSO, plafond par logement) + MPR AMO +
   *  Ecoréno' études + bonus été si BSO + CEE interpolés. */
  function aidesReactives(p, sel, gainEp, source) {
    const P = vue(p);
    if (source === undefined) source = "avp";
    const ar = P.aides.reactives;
    // aides.reactives.k (hypothese_cs:calibrage_k_sur_operene.p5.mpr_travaux) ; bso_part_mpr (hypothese_cs:part_hiver_cluster_bso_0_64)
    const k = nombre(ar.k), bsoPart = nombre(ar.bso_part_mpr);
    // plafond_assiette_par_logement (reglementaire:mpr_copro_plafond_25000_ht_par_logement) x nb_logements (avp.p4.logements)
    const plafondTotal = nombre(ar.plafond_assiette_par_logement) * nombre(ar.nb_logements);
    let assiette = 0.0, mwh = 0.0, bso = false, aMpr = false;
    for (const lotId of (sel || [])) {
      const lot = prop(P.lots, lotId);
      if (!lot) continue;
      const regime = lot.mpr_regime;
      const nu = assietteNuLot(P, lotId, source);
      if (regime === "k") {
        assiette += nu * k;
        aMpr = true;
      } else if (regime === "bso") {
        assiette += nu * bsoPart;
        aMpr = true;
        bso = true;
      }
      mwh += nombre(lot.mwh_avp || 0);
    }
    assiette = Math.min(assiette, plafondTotal);
    // seuil_gain (operene.p3.mpr_seuil_pct) ; seuil_gain_haut (reglementaire:mpr_copro_45pct_si_gain_50)
    const seuil = nombre(ar.seuil_gain) * 100, seuilHaut = nombre(ar.seuil_gain_haut) * 100;
    // taux_mpr : gain_35 (operene.p5.mpr_travaux_taux), gain_50 (reglementaire:mpr_copro_45pct_si_gain_50), sous_seuil
    const tx = ar.taux_mpr;
    const taux = gainEp >= seuilHaut ? nombre(tx.gain_50) : (gainEp >= seuil ? nombre(tx.gain_35) : nombre(tx.sous_seuil));
    // honoraires_aides : mpr_amo (operene.p5.mpr_amo), ecoreno_hono (operene.p5.ecorenov_etudes) ; ecoreno_ete_bso (operene.p5.ecorenov_bonus_ete)
    const h = ar.honoraires_aides;
    const mprTravaux = arrondiJs(taux * assiette);
    const mprAmo = (taux > 0 && aMpr) ? Math.trunc(h.mpr_amo) : 0;
    const ecorenoHono = aMpr ? Math.trunc(h.ecoreno_hono) : 0;
    const ecorenoEte = bso ? Math.trunc(ar.ecoreno_ete_bso) : 0;
    const cee = aMpr ? ceeInterpole(P, mwh) : 0;
    const total = mprTravaux + mprAmo + ecorenoHono + ecorenoEte + cee;
    return {
      assiette: arrondiJs(assiette), taux: taux, mpr_travaux: mprTravaux, mpr_amo: mprAmo,
      ecoreno_hono: ecorenoHono, ecoreno_ete: ecorenoEte, cee: cee, total: total,
      bso: bso, a_mpr: aMpr, mwh: mwh, source_prix: source,
      badge: "estimation, tableau OPERENE sur devis attendu",
    };
  }

  /** Régime éco-PTZ d'une composition : performance globale (gain EP >= seuil) ou barème par actions. */
  function ecoptzRegime(p, sel, gainEp) {
    const P = vue(p);
    // aides.ecoptz_actions : mapping_lots_actions, regime_global (operene.p3.eco_ptz_plafond_eur, operene.p3.eco_ptz_duree_max_ans,
    // operene.p3.mpr_seuil_pct), bareme_par_actions (reglementaire:eco_ptz_bareme_par_actions_2026 ; mail.20260723.syndic.eco_ptz_2_lots),
    // duree_actions_ans (mail.20260723.syndic.eco_ptz_2_lots)
    const ea = P.aides.ecoptz_actions;
    const coches = new Set(sel || []);
    const mapping = ea.mapping_lots_actions;
    const actions = Object.keys(mapping).filter((a) => mapping[a].some((l) => coches.has(l))).sort();
    const nb = actions.length;
    if (gainEp >= nombre(ea.regime_global.seuil_gain) * 100) {
      const rg = ea.regime_global;
      return { nb_actions: nb, actions: actions, regime: "global", plafond_eur: Math.trunc(rg.plafond_eur), duree_ans: Math.trunc(rg.duree_ans) };
    }
    const plafond = nb <= 0 ? 0 : Math.trunc(ea.bareme_par_actions[String(Math.min(nb, 3))]);
    return { nb_actions: nb, actions: actions, regime: "par_actions", plafond_eur: plafond, duree_ans: Math.trunc(ea.duree_actions_ans) };
  }

  /** Aides du programme : réactives (estimation) ou montant figé fourni (tableau OPERENE, canon). */
  function aidesProgramme(p, sel, source, aidesOverride) {
    const P = vue(p);
    const g = gainCepAffiche(P, sel);
    if (!estNul(aidesOverride)) {
      return { total: nombre(aidesOverride), mode: "figees", detail: null, gain_ep: g.gain, badge: "montant figé (tableau OPERENE / canon), décomposition non recalculée" };
    }
    if (source === "odj" && P.aides.odj_blocs) {
      const a = aidesOdj(P, sel, g.gain);
      return { total: nombre(a.total), mode: "odj_blocs", detail: a, gain_ep: g.gain, badge: a.badge };
    }
    const a = aidesReactives(P, sel, g.gain, source);
    return { total: nombre(a.total), mode: "reactives", detail: a, gain_ep: g.gain, badge: a.badge };
  }

  /** Aides de la convocation (rés. 04) : somme des blocs dont tous les lots aidés sont cochés ; sous 35 % de gain,
   *  MaPrimeRénov' tombe à 0 ; même forme de détail que la formule réactive. */
  function aidesOdj(p, sel, gainEp) {
    const P = vue(p);
    const ob = P.aides.odj_blocs;
    const ar = P.aides.reactives;
    const coches = new Set(sel || []);
    const seuil = nombre(ar.seuil_gain) * 100;
    const mprOk = gainEp >= seuil;
    let mpr = 0, ecoreno = 0, cee = 0;
    const presents = [];
    for (const nom of Object.keys(ob.blocs)) {
      const b = ob.blocs[nom];
      const lotsB = b.lots.filter((l) => has(P.lots, l));
      if (lotsB.length && lotsB.every((l) => coches.has(l))) {
        presents.push(nom);
        mpr += mprOk ? entier(b.mpr) : 0;
        ecoreno += entier(b.ecoreno);
        cee += entier(b.cee);
      }
    }
    const total = mpr + ecoreno + cee;
    return { assiette: null, taux: (mprOk ? 0.30 : 0.0), mpr_travaux: mpr, mpr_amo: 0, ecoreno_hono: 0, ecoreno_ete: ecoreno, cee: cee,
             total: total, bso: presents.indexOf("occultations") >= 0, a_mpr: mprOk && presents.length > 0, mwh: null, source_prix: "odj",
             blocs: presents, badge: "convocation du 21/10/2026, résolution 04 (OPERENE sur devis)" };
  }

  // ============================================================================
  // 6. CALENDRIERS : événements subis (section 5 du Python)
  // ============================================================================

  function evenement(p, idEv) {
    // calendriers.evenements.<id> : prix_ttc (avp.p123 / p125 ; equilibrage : derive avp.p125 + avp.p127),
    // annees (hypothese_cs:timing_matrix_classeur_11_07 ; toiture : HORIZON_30 14/07/2026)
    return vue(p).calendriers.evenements[idEv];
  }

  function scopeCalendrier(p, variante) {
    // calendriers.scope (hypothese_cs:scope_lpl_classeur_11_07)
    return vue(p).calendriers.scope[variante].slice();
  }

  /** 'subi' (canon), 'planifie', 'forte' ou un nombre. */
  function coefUrgence(p, urgence) {
    if (typeof urgence === "number" || typeof urgence === "boolean") return nombre(urgence);
    // calendriers.urgence_options (hypothese_cs:urgence_options_simulateur ; subi = cs.h1.majoration_urgence)
    return nombre(vue(p).calendriers.urgence_options[urgence]);
  }

  /** Frais d'un chantier fait hors programme (décision du CS du 28/09/2026, mutualisation perdue) : comme le
   *  programme, (1 + imprévus) x (1 + honoraires et frais liés) ; 1 quand le réglage est coupé. */
  function coefFraisChantier(p) {
    // calendriers.frais_chantiers_separes (hypothese_cs:frais_chantiers_separes_28_09_2026 ; cs.aleas_chantier ; cs.honoraires_moe)
    const f = vue(p).calendriers.frais_chantiers_separes;
    if (!f || !f.actif) return 1.0;
    return (1 + nombre(f.aleas)) * (1 + nombre(f.honoraires));
  }

  /** Coût collectif d'un événement à sa survenue : prix d'aujourd'hui x (1 + BTP)^an x frais du chantier x majoration.
   *  Retourne {cout, an}. */
  function coutEvenement(p, idEv, variante, avecUrgence, urgence) {
    const P = vue(p);
    if (avecUrgence === undefined) avecUrgence = true;
    if (urgence === undefined) urgence = "subi";
    const ev = evenement(P, idEv);
    const an = entier(ev.annees[variante]);
    // calendriers.inflation_btp_an (hypothese_cs:inflation_btp_2pct)
    let cout = nombre(ev.prix_ttc) * Math.pow(1 + nombre(P.calendriers.inflation_btp_an), an);
    // frais du chantier séparé (imprévus et honoraires, comme le programme), dans les flux comme dans le solde
    cout *= coefFraisChantier(P);
    // calendriers.evenements.<id>.urgence_fixe (toiture : même majoration dans tous les scénarios)
    if (avecUrgence) cout *= coefUrgence(P, ev.urgence_fixe || urgence);
    return { cout: cout, an: an };
  }

  /** Part (pondérée par les prix de base) des événements du scope déjà réalisés à l'année donnée. */
  /* ---------------------------------------------------------------- plus-value lot par lot (06/10/2026, décision du conseil syndical, A240 ;
     model_v2.py : methode_plus_value, points_energie_base, parts_plus_value, lots_valorises, chemin_valeur_par_lot) */
  function methodePlusValue(p) {
    const pv = vue(p).immobilier.plus_value;
    return has(pv, "methode") ? pv.methode : "forfaitaire";
  }

  function pointsEnergieBase(p) {
    const L = lots(p);
    let s = 0;
    for (const lid of Object.keys(L)) if (L[lid].groupe === "base") s += nombre(L[lid].cep_pts || 0);
    return s;
  }

  function partsPlusValue(p) {
    const P = vue(p);
    const pv = P.immobilier.plus_value;
    const socle = nombre(pv.renov.socle_etiquette_c), bonusOcc = nombre(pv.renov.bonus_occultations);
    const opts = pv.par_lot.options;
    const base = pointsEnergieBase(p);
    const L = lots(p), parts = {};
    for (const lid of Object.keys(L)) {
      let part = 0.0;
      if (L[lid].groupe === "base" && base > 0) part = socle * nombre(L[lid].cep_pts || 0) / base;
      if (has(opts, lid)) part += nombre(opts[lid]);
      if (lid === "P13a") part += bonusOcc;
      parts[lid] = part;
    }
    return parts;
  }

  function lotsValorises(p, situation, plan) {
    const P = vue(p);
    const tables = P.immobilier.plus_value.par_lot.evenements_valorises;
    const table = has(tables, situation) ? tables[situation] : {};
    const L = lots(p), out = [];
    for (const e of plan.evenements) {
      if (has(table, e.id) && has(L, table[e.id])) out.push([table[e.id], entier(e.annee)]);
    }
    return out;
  }

  function cheminValeurParLot(p, realises, H) {
    const P = vue(p);
    const parts = partsPlusValue(p), L = lots(p);
    const base = pointsEnergieBase(p);
    const s0 = nombre(P.immobilier.plus_value.subir_horizon);
    const chemin = zeros(H + 1);
    let vieux = 0.0;
    for (let an = 1; an <= H; an++) {
      let pts = 0.0, somme = 0.0;
      for (const [lid, a] of realises) {
        if (a <= an) { pts += nombre(L[lid].cep_pts || 0); somme += parts[lid]; }
      }
      const partRenovee = base > 0 ? Math.min(1.0, pts / base) : 0.0;
      vieux += s0 / H * (1.0 - partRenovee);
      chemin[an] = vieux + somme;
    }
    return chemin;
  }

  function avancementLxl(p, variante, annee, ids) {
    const P = vue(p);
    const sc = !estNul(ids) ? ids : scopeCalendrier(P, variante);
    let w = 0;
    for (const i of sc) w += nombre(evenement(P, i).prix_ttc);
    if (w <= 0) return 0.0;
    let a = 0;
    for (const i of sc) {
      const ev = evenement(P, i);
      if (entier(ev.annees[variante]) <= annee) a += nombre(ev.prix_ttc);
    }
    return a / w;
  }

  // ============================================================================
  // 7. CONFIGURATION ET SITUATIONS (plans) (section 6 du Python)
  // ============================================================================

  /** Configuration par défaut du simulateur (retour au défaut en un clic). */
  function configDefaut(p) {
    const P = vue(p);
    // meta.config_defaut (hypothese_cs:defaut_plan_aide_spec_2A ; hypothese_cs:defaut_0 ; cs.h2.pret_collectif_classique_duree_ans)
    const c = copie(P.configDefautBrut);
    for (const k of Object.keys(c)) {
      if (k.charAt(0) === "_") delete c[k];
    }
    c.composition = compositionDefaut(P);
    c.par_lot = {};
    c.gestes = {};
    c.aides_override = null;
    c.gain_override = null;
    c.evenements_subir = null;
    c.variante_gaz = null;
    return c;
  }

  /** Complète une configuration partielle par les défauts (clés absentes ou null), normalise la
   *  composition, force la part comptant en mode comptant, borne la part comptant et la durée. */
  function configEffective(p, config) {
    const P = vue(p);
    const c = configDefaut(P);
    const src = config || {};
    for (const k of Object.keys(src)) {
      const v = src[k];
      if (!estNul(v) || CLES_NULLABLES.indexOf(k) >= 0) c[k] = copie(v === undefined ? null : v);
    }
    // Python : `c.get("composition") or composition_defaut(p)` (une liste vide vaut « défaut »)
    c.composition = normaliserComposition(P, (c.composition && c.composition.length) ? c.composition : compositionDefaut(P));
    if (c.mode_collectif === "comptant") c.part_comptant = 1.0;
    c.part_comptant = borne01(c.part_comptant);
    // financement.pret_collectif_classique.duree_min_ans / duree_max_ans (cs.h2.pret_collectif_classique_duree_ans)
    const cl = P.financement.pret_collectif_classique;
    c.duree_classique = Math.trunc(Math.min(cl.duree_max_ans, Math.max(cl.duree_min_ans, entier(c.duree_classique))));
    return c;
  }

  /** Réglage financier d'un événement subi : {part_comptant, type_pret} (défaut = mode canonique). */
  function reglageLot(p, config, idEv) {
    const P = vue(p);
    // calendriers.evenements.<id>.mode_canon (classeur du 11/07 : prêt ou comptant)
    const ev = evenement(P, idEv);
    const r = { part_comptant: ev.mode_canon === "pret" ? 0.0 : 1.0, type_pret: "subi" };
    const src = prop(config.par_lot || {}, idEv) || {};
    for (const k of Object.keys(src)) {
      if (!estNul(src[k])) r[k] = src[k];
    }
    // calendriers.evenements.<id>.pret_possible = false (toiture : mail.20260729.syndic.toiture_5_ans, appels de fonds) :
    // comptant quel que soit le réglage
    if (ev.pret_possible === false) r.part_comptant = 1.0;
    r.part_comptant = borne01(r.part_comptant);
    return r;
  }

  /** Construit le « plan » d'une situation : composition, capex, aides, gain de facture par année,
   *  événements collectifs, règles d'entretien et de plus-value. Tout est à l'échelle de la
   *  copropriété ; la quote-part vient ensuite (calculer). Convention interne : index = année. */
  /** Composition réellement faite au chantier (année anT, calendrier variante) : un ouvrage des « residuels » à refaire
   *  AVANT le chantier (toiture en 2031 au calendrier attendu) est refait à part et SORT du programme voté.
   *  Miroir de model_v2.composition_realisee ; à utiliser aussi pour les aides d'un programme reporté (correction du
   *  28/09/2026, nuit : les aides sont celles de la composition réalisée, pas de la composition votée). */
  /** Durée du chantier du programme, en années civiles (situations.RENOV.duree_chantier_ans ; 0 si absent : anciens
   *  jeux de paramètres, effets dès l'année du chantier). Miroir de model_v2.duree_chantier. */
  function dureeChantier(P) {
    const d = P.situations.RENOV.duree_chantier_ans;
    return estNul(d) ? 0 : entier(d);
  }

  function compositionRealisee(P, composition, variante, anT) {
    let sel = composition.slice();
    const sortis = [];
    const residuels = P.situations.RENOV.residuels;
    for (const nom of Object.keys(residuels)) {
      const lot = residuels[nom].si_lot_absent;
      if (sel.indexOf(lot) >= 0 && scopeCalendrier(P, variante).indexOf(nom) >= 0 && entier(evenement(P, nom).annees[variante]) < anT) {
        sel = normaliserComposition(P, sel.filter((x) => x !== lot));
        sortis.push(lot);
      }
    }
    return { composition: sel, sortis: sortis };
  }

  function planSituation(p, situation, config) {
    const P = vue(p);
    const H = P.H;
    const c = configEffective(P, config);
    const variante = c.calendrier;
    const sit = P.situations[situation];
    const plan = {
      situation: situation, config: c, libelle: sit.libelle, affiche: !!sit.affiche, programme: null,
      evenements: [], gain_facture: zeros(H + 1), an_chaudiere_neuve: null, an_vmc: null,
      bso: false, plateau_entretien_an: null, derive_ponderee: false, pv: {}, cep: null,
      lots_realises_horizon: [],
    };
    // cs.conso_gaz_canon_mwh
    const conso = P.energie.conso_gaz_mwh_an;
    const pvBloc = P.immobilier.plus_value;
    const cepBloc = P.energie.cep;

    if (situation === "RENOV") {
      // situations.RENOV.annee_travaux (hypothese_cs:chantier_2027_annee_1)
      const anT = entier(P.situations.RENOV.annee_travaux);
      // situations.RENOV.duree_chantier_ans (hypothese_cs:effets_apres_le_chantier_2_ans_02_10_2026) : les EFFETS du
      // programme (économies d'énergie, contrats d'entretien des équipements neufs, plateau de l'entretien, enveloppe
      // réalisée, prime de valeur) commencent l'année anE = anT + durée ; les PAIEMENTS (appels de fonds, prêts, aides)
      // restent à l'année du chantier anT. Durée 0 = ancienne règle (effets dès l'année du chantier, prime à moitié).
      const duree = dureeChantier(P);
      const anE = anT + duree;
      // vote reporté : un ouvrage à refaire AVANT le chantier du programme (toiture « sous 5 ans », syndic 29/07) est
      // refait à part à sa date et SORT du programme voté plus tard (décision du 28/09/2026, fourchette des options)
      const cr = compositionRealisee(P, c.composition, variante, anT);
      const sel = cr.composition, sortis = cr.sortis;
      const cap = capexProgramme(P, sel, c.source_prix);
      const aides = aidesProgramme(P, sel, c.source_prix, c.aides_override);
      const gcep = gainCepAffiche(P, sel);
      const regime = ecoptzRegime(P, sel, gcep.gain);
      const gain = !estNul(c.gain_override) ? nombre(c.gain_override) : gainFactureComposition(P, sel);
      plan.programme = {
        composition: sel, validite: compositionValide(P, c.composition), capex: cap, aides: aides,
        reste_a_charge: cap.ttc - aides.total, gain_facture: gain, cep: gcep,
        verdict: verdictSeuil(P, gcep.gain, gcep.certifie), ecoptz: regime,
        source_prix: c.source_prix, annee_travaux: anT, duree_chantier_ans: duree, annee_effet: anE, lots_refaits_a_part: sortis,
      };
      for (let an = anE; an <= H; an++) plan.gain_facture[an] = gain;
      plan.an_chaudiere_neuve = sel.indexOf("P2") >= 0 ? anE : null;
      plan.an_vmc = sel.indexOf("P7") >= 0 ? anE : null;
      plan.bso = sel.indexOf("P13a") >= 0;
      // charges.plateau_renov_des_annee (hypothese_cs:plateau_des_annee_des_travaux) = année du chantier (les hôtes la
      // posent à anT pour un vote reporté) ; le plateau prend effet après le chantier
      plan.plateau_entretien_an = entier(P.charges.plateau_renov_des_annee) + duree;
      plan.cep = gcep;
      plan.lots_realises_horizon = sel.slice();
      // situations.RENOV.residuels.toiture : proba 1 (mail.20260729.syndic.toiture_5_ans : réfection certaine),
      // urgence_dans_flux et urgence_dans_solde (cs.h1.majoration_urgence ; alignement décidé par le CS le 27/09/2026)
      const residuels = P.situations.RENOV.residuels;
      for (const nom of Object.keys(residuels)) {
        const r = residuels[nom];
        if (sel.indexOf(r.si_lot_absent) < 0 && scopeCalendrier(P, variante).indexOf(nom) >= 0) {
          const ce = coutEvenement(P, nom, variante, r.urgence_dans_flux, c.urgence);
          const cs = coutEvenement(P, nom, variante, r.urgence_dans_solde, c.urgence);
          plan.evenements.push({
            id: nom, type: "residuel", annee: ce.an, montant: ce.cout, montant_solde: cs.cout,
            proba: nombre(r.proba), aides: 0.0, reglage: reglageLot(P, c, nom), libelle: evenement(P, nom).nom,
          });
        }
      }
      // typologies.plus_value.renov : socle_etiquette_c (hypothese_cs:plus_value_s2_11pct_expert_13_07),
      // bonus_occultations (hypothese_cs:plus_value_s25_14pct_expert_13_07), bonus_programme_complet (hypothese_cs:plus_value_s3_16pct_expert_13_07)
      const pvr = pvBloc.renov;
      let pct;
      if (methodePlusValue(P) === "par_lot") {
        // 06/10/2026 : la somme des parts des lots de la composition réalisée (+14 % base S2.5, +16 % avec toiture et robinets)
        const parts = partsPlusValue(P);
        pct = 0.0;
        for (const x of sel) if (has(parts, x)) pct += parts[x];
      } else {
        pct = nombre(pvr.socle_etiquette_c);
        if (sel.indexOf("P13a") >= 0) {
          pct += nombre(pvr.bonus_occultations);
          if (sel.indexOf("P14") >= 0 && sel.indexOf("P6a") >= 0) pct += nombre(pvr.bonus_programme_complet);
        }
      }
      // avant l'année d'effet (attente du vote reporté, puis chantier), chemin de valeur « sans programme »
      // (typologies.plus_value.subir_horizon : cs.h1.decote_valeur_ne_rien_decider_pct) ; ensuite : prime entière.
      // Durée du chantier 0 (ancienne règle) : prime à moitié l'année du chantier (typologies.plus_value.phi_annee_travaux,
      // hypothese_cs:prime_a_moitie_annee_du_chantier_13_07 ; phi_dans_solde : aussi dans le solde, correctif du 28/09/2026)
      plan.pv = { type: "renov", pct: pct, an_travaux: anT, an_effet: anE, phi: nombre(pvBloc.phi_annee_travaux), pct_s0: nombre(pvBloc.subir_horizon),
                  phi_solde: !!pvBloc.phi_dans_solde };
      return plan;
    }

    if (situation === "S0") {
      // typologies.plus_value.subir_horizon (cs.h1.decote_valeur_ne_rien_decider_pct)
      plan.pv = { type: "lineaire", pct: nombre(pvBloc.subir_horizon) };
      plan.cep = {
        gain: 0.0, cep_proj: nombre(cepBloc.cep_initial), certifie: true,
        classe: classeDpe(P, nombre(cepBloc.cep_initial)), badge: "état initial", ancre: null,
      };
      return plan;
    }

    // --- situations à événements subis (SUBIR, LXL, PERSO)
    let ids;
    if (situation === "SUBIR") {
      // H12 : « Ne rien décider » = aucun lot voté ; seules les pannes du scope propre (chaudière, toiture,
      // balconnets) sont réparées en urgence, à l'identique, aux dates du calendrier ; variante de contrôle
      // config.evenements_subir (chaudière seule = S0 réaliste du moteur historique).
      // situations.SUBIR.scope (hypothese_cs:H12_scope_subir_pannes_seules, coordination du 23/09)
      ids = !estNul(c.evenements_subir) ? c.evenements_subir.slice() : P.situations.SUBIR.scope.slice();
    } else {
      ids = scopeCalendrier(P, variante);
    }
    for (const idEv of ids) {
      const ce = coutEvenement(P, idEv, variante, true, c.urgence);
      let aidesEv = 0.0;
      if ((situation === "LXL" || situation === "PERSO") && c.cee_par_geste) {
        // aides.cee_par_geste : toiture (mail.20260729.operene.toiture_cee_seule), autres (hypothese_cs:aucune_source)
        const cpg = P.aides.cee_par_geste;
        const v = has(cpg, idEv) ? cpg[idEv] : cpg.autres;
        aidesEv = nombre(v || 0);
      }
      plan.evenements.push({
        id: idEv, type: "subi", annee: ce.an, montant: ce.cout, montant_solde: ce.cout,
        proba: 1.0, aides: aidesEv, reglage: reglageLot(P, c, idEv), libelle: evenement(P, idEv).nom,
      });
    }
    const ans = {};
    for (const e of plan.evenements) ans[e.id] = e.annee;
    plan.an_chaudiere_neuve = has(ans, "chaudiere") ? ans.chaudiere : null;
    plan.an_vmc = has(ans, "vmc") ? ans.vmc : null;
    if (situation === "SUBIR") {
      // energie.subir.gain_gaz_chaudiere_mwh (avp.p123.chaudieres_gain_mwh)
      const g47 = nombre(P.energie.subir.gain_gaz_chaudiere_mwh) / conso;
      if (has(ans, "chaudiere")) {
        for (let an = ans.chaudiere; an <= H; an++) plan.gain_facture[an] = g47;
      }
      plan.pv = { type: "lineaire", pct: nombre(pvBloc.subir_horizon) };
      if (methodePlusValue(P) === "par_lot") {
        const real = lotsValorises(P, situation, plan);
        const chemin = cheminValeurParLot(P, real, H);
        plan.pv = { type: "par_lot", pct: chemin[H], pct_s0: nombre(pvBloc.subir_horizon), chemin: chemin, lots: real };
      }
      // energie.cep.ancres_avp.S1 (avp.p124.sc1_gain_pct)
      const a1 = cepBloc.ancres_avp.S1;
      const cep0 = nombre(cepBloc.cep_initial);
      if (has(ans, "chaudiere")) {
        plan.cep = {
          gain: nombre(a1.gain_ep_pct), cep_proj: nombre(a1.cep_proj), certifie: true, ancre: "S1",
          classe: classeDpe(P, nombre(a1.cep_proj)),
          badge: "chaudière seule (ancre SC1, AVP p. 124), à partir de l'an " + String(ans.chaudiere),
        };
      } else {
        plan.cep = { gain: 0.0, cep_proj: cep0, certifie: true, ancre: null, classe: classeDpe(P, cep0), badge: "état initial" };
      }
      plan.lots_realises_horizon = has(ans, "chaudiere") ? ["P2"] : [];
    } else {
      // energie.lxl : gain_facture_final (hypothese_cs:classeur_11_07_gain_final_lpl), gain_efficacite_mwh
      // (avp.p123.chaudieres_gain_mwh, avp.p125.calorifuge_gain_mwh, avp.p125.equilibrage_gain_mwh)
      const lx = P.energie.lxl;
      const final = nombre(lx.gain_facture_final[variante]);
      const eff = {};
      for (const k of Object.keys(lx.gain_efficacite_mwh)) {
        if (ids.indexOf(k) >= 0) eff[k] = nombre(lx.gain_efficacite_mwh[k]);
      }
      const clesEff = Object.keys(eff);
      let denom = 0;
      for (const k of clesEff) denom += eff[k];
      for (let an = 1; an <= H; an++) {
        let acquis = 0;
        for (const k of clesEff) {
          if (ans[k] <= an) acquis += eff[k];
        }
        plan.gain_facture[an] = denom ? final * acquis / denom : 0.0;
      }
      // typologies.plus_value.lxl_par_calendrier (hypothese_cs:plus_value_lpl_classeur_11_07)
      plan.pv = { type: "lxl", pct: nombre(pvBloc.lxl_par_calendrier[variante]), pct_s0: nombre(pvBloc.subir_horizon), variante: variante, ids: ids.slice() };
      if (methodePlusValue(P) === "par_lot") {
        const real = lotsValorises(P, situation, plan);
        const chemin = cheminValeurParLot(P, real, H);
        plan.pv = { type: "par_lot", pct: chemin[H], pct_s0: nombre(pvBloc.subir_horizon), chemin: chemin, lots: real, variante: variante, ids: ids.slice() };
      }
      // charges.derive_lxl_ponderee_par_avancement (hypothese_cs:H6_derive_lxl_ponderee)
      plan.derive_ponderee = !!P.charges.derive_lxl_ponderee_par_avancement;
      const realises = Object.keys(P.lots).filter((lotId) => ids.indexOf(P.lots[lotId].evenement_lpl) >= 0 && P.lots[lotId].evenement_lpl !== "ravalement");
      const gc = gainCep(P, realises);
      plan.cep = { gain: gc.gain, cep_proj: gc.cep_proj, certifie: false, ancre: null, classe: classeDpe(P, gc.cep_proj), badge: "estimation à l'horizon (lots subis réalisés), à certifier BET" };
      plan.lots_realises_horizon = realises;
    }
    return plan;
  }

  // ============================================================================
  // 8. FINANCEMENT : engagements du logement, prêts, flux annuels (section 7 du Python)
  // ============================================================================

  /** Liste des engagements financiers d'un logement (quote-part appliquée) : programme, événements
   *  subis / résiduels, gestes individuels (PERSO). */
  function engagementsLogement(p, plan, typo) {
    const P = vue(p);
    const qp = quotePart(P, typo);
    const c = plan.config;
    const out = [];
    if (plan.programme) {
      const pr = plan.programme;
      const qpp = quotePartProgramme(P, typo, pr.capex);   // clés de charges de la convocation (source « odj »), sinon la clé unique
      out.push({
        id: "programme", type: "programme", libelle: "Les travaux de rénovation", annee: pr.annee_travaux,
        montant: pr.capex.ttc * qpp, montant_solde: pr.capex.ttc * qpp,
        aides: pr.aides.total * qpp, proba: 1.0, ecoptz: pr.ecoptz, quote_part: qpp,
      });
    }
    for (const ev of plan.evenements) {
      out.push({
        id: "ev:" + ev.id, type: ev.type, libelle: ev.libelle, annee: ev.annee,
        montant: ev.montant * qp * ev.proba, montant_solde: ev.montant_solde * qp * ev.proba,
        aides: ev.aides * qp * ev.proba, proba: ev.proba, reglage: ev.reglage,
      });
    }
    // gestes individuels : toutes les situations depuis le 29/09/2026 (Perso = Lot par lot + gestes, gardé pour compatibilité)
    for (const x of gestesActifs(P, plan)) {
      const g = c.gestes[x.gid];
      const prix = prixGeste(P, x.gid, typo, c.source_prix);
      out.push({
        id: "geste:" + x.gid, type: "geste", libelle: x.g.libelle, annee: x.an,
        montant: prix, montant_solde: prix, aides: 0.0, proba: 1.0,
        reglage: {
          part_comptant: borne01(estNul(g.part_comptant) ? 1.0 : g.part_comptant),
          type_pret: g.type_pret || "personnel",
        },
      });
    }
    return out;
  }

  /** Prix d'un geste individuel pour une typologie (robinets : montant collectif x nb de pièces / parc). */
  function prixGeste(p, gid, typo, source) {
    const P = vue(p);
    if (source === undefined) source = "rao";
    const gi = P.gestes[gid];
    if (gid === "robinets_individuels") {
      // montant_collectif_rao (rao.p30.lot11.option_robinets_thermostatiques_e2s_ttc) ; montant_collectif_avp (avp.p127.robinets_ttc)
      const montant = nombre(source === "rao" ? gi.montant_collectif_rao : source === "odj" ? (estNul(gi.montant_collectif_odj) ? gi.montant_collectif_avp : gi.montant_collectif_odj) : gi.montant_collectif_avp);
      // gestes_individuels.fenetres.nb_menuiseries (hypothese_cs:conventions_fenetres_plans_types_1969) ; nb_menuiseries_parc (derive)
      const nb = P.gestes.fenetres.nb_menuiseries;
      return montant * nb[typo] / nombre(P.gestes.fenetres.nb_menuiseries_parc);
    }
    // clim : cs.clim.invest_par_logement_eur ; iti : hypothese_cs:note_chiffrage_iti_cabinet_ia_21_07 ; fenetres : derive:nb_menuiseries x 1 985
    return nombre(gi.prix_par_typologie[typo]);
  }

  /** Enregistrement d'un prêt (null si capital nul). interetsSeuls = [mois_interets, duree_mois] pour
   *  l'avance de subvention (intérêts seuls, remboursée par les aides). */
  function pret(id, libelle, capital, taux, dureeAns, periodicite, anDebut, typePret, interetsSeuls) {
    if (capital <= 0) return null;
    if (interetsSeuls) {
      const moisInt = interetsSeuls[0], dureeMois = interetsSeuls[1];
      const total = capital * taux * moisInt / 12.0;
      const pmt = total / dureeMois;
      return {
        id: id, libelle: libelle, type: typePret, capital: capital, taux: taux, n_periodes: dureeMois,
        periodicite: 12, paiement: pmt, an_debut: anDebut, total_paye: total, interets: total,
        interets_seuls: true, duree_ans: dureeMois / 12.0,
      };
    }
    const n = Math.round(dureeAns * periodicite);
    const pmt = paiementPeriodique(capital, taux, n, periodicite);
    return {
      id: id, libelle: libelle, type: typePret, capital: capital, taux: taux, n_periodes: n,
      periodicite: periodicite, paiement: pmt, an_debut: anDebut, total_paye: pmt * n,
      interets: pmt * n - capital, interets_seuls: false, duree_ans: dureeAns,
    };
  }

  /** Prêts et comptant du programme pour un engagement (quote-part brute et aides) selon le mode
   *  collectif (aide / classique / comptant), la part comptant et l'éligibilité. Retourne {prets, comptant}. */
  function pretsProgramme(p, eng, config, prefixe) {
    const P = vue(p);
    if (prefixe === undefined) prefixe = "";
    const fin = P.financement;
    const pc = nombre(config.part_comptant);
    const montant = eng.montant, aides = eng.aides;
    const net = montant - aides;
    const comptant = pc * net;
    const F = (1 - pc) * net;
    const prets = [];
    const an = eng.annee;
    const mode = config.mode_collectif;
    if (mode === "comptant" || F <= 1e-9) return { prets: prets, comptant: comptant };
    if (config.plan_aide === "historique_avp" && mode === "aide") {
      // financement.plan_aide_historique_avp : part_du_net (hypothese_cs:classeur_11_07), taux et durées (qp.p2.*),
      // periodicite 1 (hypothese_cs:classeur_11_07_annuites_annuelles)
      const h = fin.plan_aide_historique_avp;
      prets.push(pret(prefixe + "eco_ptz", "Éco-PTZ (70 % du net, classeur)", F * h.eco_ptz.part_du_net, h.eco_ptz.taux, h.eco_ptz.duree_ans, h.eco_ptz.periodicite, an, "eco_ptz"));
      prets.push(pret(prefixe + "copro100", "Copro 100 (30 % du net, classeur)", F * h.copro100.part_du_net, h.copro100.taux, h.copro100.duree_ans, h.copro100.periodicite, an, "copro100"));
      return { prets: prets.filter((x) => x), comptant: comptant };
    }
    const pa = fin.plan_aide;
    // financement.plan_aide.avance : taux (qp.p2.avance_taux_pct), duree_mois (operene.p7.pret_avance_duree_mois),
    // mois_interets_factures (hypothese_cs:calibrage_sur_qp.p2.mensualite_avance_subvention) ;
    // avance_en_mode_classique (hypothese_cs:aides_versees_apres_travaux_dans_tous_les_modes)
    const av = pa.avance;
    let avance = null;
    if (mode === "aide" || (mode === "classique" && pa.avance_en_mode_classique)) {
      avance = pret(prefixe + "avance", "Prêt avance de subvention (4,30 %, 18 mois)", aides * (1 - pc), av.taux, null, 12, an, "avance", [Math.trunc(av.mois_interets_factures), Math.trunc(av.duree_mois)]);
    }
    if (mode === "aide") {
      // financement.plan_aide.eco_ptz : taux (qp.p2.ptz_taux_pct), duree_ans (qp.p2.ptz_duree_ans),
      // plafond_par_logement (operene.p3.eco_ptz_plafond_eur), part_eligible (operene.p11.eco_ptz_part_pct), periodicite (qp.p2.mensualite_ptz)
      const e = pa.eco_ptz;
      const regime = eng.ecoptz || {};
      const plafond = nombre(has(regime, "plafond_eur") ? regime.plafond_eur : e.plafond_par_logement);
      const duree = entier(has(regime, "duree_ans") ? regime.duree_ans : e.duree_ans);
      const eligible = has(config, "eligible_ecoptz") ? config.eligible_ecoptz : true;
      let ptzCap;
      if (eligible) ptzCap = Math.min(F, e.part_eligible * montant * (1 - pc), plafond);
      else ptzCap = 0.0;
      const reste = F - ptzCap;
      prets.push(pret(prefixe + "eco_ptz", "Éco-PTZ collectif", ptzCap, e.taux, duree, e.periodicite, an, "eco_ptz"));
      // financement.plan_aide.copro100 : taux (qp.p2.copro100_taux_pct), duree_ans (qp.p2.copro100_duree_ans), periodicite (qp.p2.mensualite_copro100) ;
      // non_eligible_ecoptz.pret (qp.p2.mensualite_copro100_non_eligible)
      const c100 = pa.copro100;
      if (reste > 1e-9) {
        if (eligible || pa.non_eligible_ecoptz.pret === "copro100") {
          prets.push(pret(prefixe + "copro100", "Copro 100", reste, c100.taux, c100.duree_ans, c100.periodicite, an, "copro100"));
        } else {
          // financement.pret_collectif_classique (cs.h2.pret_collectif_classique_taux ; periodicite : hypothese_cs:mensualites_convention_8ter_du_moteur_historique)
          const cl = fin.pret_collectif_classique;
          prets.push(pret(prefixe + "classique", "Prêt collectif classique", reste, cl.taux, config.duree_classique, cl.periodicite, an, "classique"));
        }
      }
    } else if (mode === "classique") {
      // financement.pret_collectif_classique.taux (cs.h2.pret_collectif_classique_taux) ; durée 10 à 15 ans (cs.h2.pret_collectif_classique_duree_ans)
      const cl = fin.pret_collectif_classique;
      prets.push(pret(prefixe + "classique", "Prêt collectif classique 7 %", F, cl.taux, config.duree_classique, cl.periodicite, an, "classique"));
    } else {
      throw new Error("mode collectif inconnu : " + String(mode));
    }
    if (avance) prets.push(avance);
    return { prets: prets.filter((x) => x), comptant: comptant };
  }

  /** Prêt / comptant d'un événement subi ou résiduel (réglage par lot) ou d'un geste individuel. */
  function pretsEvenement(p, eng, prefixe) {
    const P = vue(p);
    if (prefixe === undefined) prefixe = "";
    const r = eng.reglage;
    const pc = nombre(r.part_comptant);
    const net = eng.montant - eng.aides;
    const comptant = pc * net;
    const F = (1 - pc) * net;
    if (F <= 1e-9) return { prets: [], comptant: comptant };
    let pr;
    if (r.type_pret === "personnel" && eng.type === "geste") {
      // financement.pret_personnel : taux (cs.h2.pret_personnel_taux), duree_ans (cs.h2.pret_personnel_duree_ans), periodicite (hypothese_cs:credit_conso_mensualites)
      const pp = P.financement.pret_personnel;
      pr = pret(prefixe + eng.id, eng.libelle + " (prêt personnel)", F, pp.taux, pp.duree_ans, pp.periodicite, eng.annee, "personnel");
    } else {
      // financement.pret_subis : taux (cs.h2.pret_collectif_classique_taux), duree_ans (cs.h2.pret_collectif_classique_duree_ans),
      // periodicite 1 (hypothese_cs:classeur_11_07_annuites_annuelles : ANNUITÉS ANNUELLES du classeur)
      const ps = P.financement.pret_subis;
      pr = pret(prefixe + eng.id, eng.libelle + " (prêt collectif 7 %)", F, ps.taux, ps.duree_ans, ps.periodicite, eng.annee, "subi");
    }
    return { prets: pr ? [pr] : [], comptant: comptant };
  }

  /** Flux de financement d'un logement (convention interne : index = année, 0 inutilisé). */
  function fluxFinancementInterne(P, plan, typo, config) {
    const H = P.H;
    const c = estNul(config) ? plan.config : configEffective(P, config);
    const engs = engagementsLogement(P, plan, typo);
    const prets = [];
    const comptant = zeros(H + 1);
    for (const eng of engs) {
      const r = eng.type === "programme" ? pretsProgramme(P, eng, c) : pretsEvenement(P, eng);
      for (const pr of r.prets) prets.push(pr);
      if (eng.annee >= 1 && eng.annee <= H) comptant[eng.annee] += r.comptant;
      else if (eng.annee < 1) comptant[1] += r.comptant;
    }
    const types = Array.from(new Set(prets.map((pr) => pr.type))).sort();
    const credits = zeros(H + 1);
    const parType = {};
    for (const t of types) parType[t] = zeros(H + 1);
    const crd = zeros(H + 1);
    let residuel = 0.0;
    for (const pr of prets) {
      const per = pr.periodicite;
      const n = pr.n_periodes;
      const m0 = (pr.an_debut - 1) * per; // index (0-based) de la première période
      for (let an = 1; an <= H; an++) {
        const debut = (an - 1) * per, fin = an * per - 1; // périodes de l'année (0-based)
        const k = Math.max(0, Math.min(fin, m0 + n - 1) - Math.max(debut, m0) + 1);
        if (k > 0) {
          credits[an] += k * pr.paiement;
          parType[pr.type][an] += k * pr.paiement;
        }
        const payes = Math.max(0, Math.min(n, an * per - m0));
        // dette restante en fin d'année : nulle tant que le prêt n'a pas commencé (correctif du 23/09/2026 :
        // avant, un prêt futur comptait son capital entier dès l'an 1 dans la valeur nette de dette)
        if (!pr.interets_seuls && an * per - m0 > 0) crd[an] += crdApres(pr.capital, pr.taux, n, payes, per);
      }
      const payesH = Math.max(0, Math.min(n, H * per - m0));
      residuel += (n - payesH) * pr.paiement;
    }
    let interets = 0;
    for (const pr of prets) interets += pr.interets;
    const mens = zeros(H + 1);
    for (let an = 1; an <= H; an++) mens[an] = credits[an] / 12.0;
    const anPret = [];
    for (let an = 1; an <= H; an++) {
      if (credits[an] > 1e-9) anPret.push(an);
    }
    let sommeCredits = 0;
    for (const a of anPret) sommeCredits += credits[a];
    let totalPayePrets = 0;
    for (const pr of prets) totalPayePrets += pr.total_paye;
    return {
      prets: prets, comptant: comptant, credits: credits, credits_par_type: parType,
      mensualite_equivalente: mens, crd: crd, interets_totaux: interets,
      total_paye_prets: totalPayePrets, residuel_post_horizon: residuel,
      mensualite_moyenne_pendant_pret: anPret.length ? sommeCredits / (12.0 * anPret.length) : 0.0,
      mensualite_max: H >= 1 ? Math.max.apply(null, mens.slice(1)) : 0.0,
      appel_comptant_total: somme(comptant.slice(1)), engagements: engs,
    };
  }

  function exposerFlux(f) {
    return Object.assign({}, f, {
      comptant: s1(f.comptant), credits: s1(f.credits), credits_par_type: s1Objet(f.credits_par_type),
      mensualite_equivalente: s1(f.mensualite_equivalente), crd: s1(f.crd),
    });
  }

  /** Flux de financement d'un logement, années 1..H (index 0 = année 1) : comptant, paiements de
   *  chaque prêt (regroupés par type), intérêts, capital restant dû (fin d'année), liste des prêts.
   *  `config` : par défaut celle du plan (déjà effective). */
  function fluxFinancement(p, plan, typo, config) {
    return exposerFlux(fluxFinancementInterne(vue(p), plan, typo, config));
  }

  /** Ce que les travaux d'un engagement coûtent si je revends à la fin de l'année an (tableau 0..H) : ce que j'ai déjà
   *  payé pour eux (comptant, versements des prêts jusque-là) plus le capital restant dû de leurs prêts, remboursé à la
   *  revente ; les intérêts des années suivantes ne comptent pas (décision du conseil syndical du 06/10/2026, A230 ; avant :
   *  capital et tous les intérêts dès l'année de l'engagement). À l'horizon, tout étant remboursé, c'est totalPayeSolde.
   *  Montant « solde » pour la toiture résiduelle, comme avant ; l'avance de subvention (intérêts seuls) compte ses
   *  intérêts versés, sans capital restant. Même calcul que model_v2.travaux_revente. */
  function travauxRevente(p, plan, eng, typo, H) {
    const P = vue(p);
    const c = plan.config;
    let r;
    if (eng.type === "programme") {
      r = pretsProgramme(P, eng, c);
    } else {
      const e2 = Object.assign({}, eng);
      e2.montant = eng.montant_solde;
      r = pretsEvenement(P, e2);
    }
    const anCpt = eng.annee >= 1 ? eng.annee : 1;
    const out = zeros(H + 1);
    for (let an = 1; an <= H; an++) {
      let v = an >= anCpt ? r.comptant : 0.0;
      for (const pr of r.prets) {
        const per = pr.periodicite, n = pr.n_periodes, m0 = (pr.an_debut - 1) * per;
        const payes = Math.max(0, Math.min(n, an * per - m0));
        v += payes * pr.paiement;
        if (!pr.interets_seuls && an * per - m0 > 0) v += crdApres(pr.capital, pr.taux, n, payes, per);
      }
      out[an] = v;
    }
    return out;
  }

  /** Total payé (capital + intérêts) d'un engagement, calculé sur le montant « solde » (toiture résiduelle : sans
   *  majoration d'urgence). Valeur à l'horizon de travauxRevente ; sert aux contrôles. */
  function totalPayeSolde(p, plan, eng, typo) {
    const P = vue(p);
    const c = plan.config;
    let r;
    if (eng.type === "programme") {
      r = pretsProgramme(P, eng, c);
    } else {
      const e2 = Object.assign({}, eng);
      e2.montant = eng.montant_solde;
      r = pretsEvenement(P, e2);
    }
    let s = r.comptant;
    for (const x of r.prets) s += x.total_paye;
    return s;
  }

  // ============================================================================
  // 9. CHARGES PAR BLOCS, GESTES INDIVIDUELS, SOLDE, VALEUR, KPI (section 8 du Python)
  // ============================================================================

  /** Part non rénovée de l'année k (0 après le plateau RENOV, 1 - avancement en LXL, 1 sinon). */
  function partNonRenovee(P, plan, k) {
    if (plan.plateau_entretien_an !== null && plan.plateau_entretien_an !== undefined && k >= plan.plateau_entretien_an) return 0.0;
    if (plan.derive_ponderee) return 1.0 - avancementLxl(P, plan.config.calendrier, k, prop(plan.pv, "ids"));
    return 1.0;
  }

  /** Facteur cumulé de dérive de l'entretien à l'année an : produit sur les années passées de
   *  (1 + dérive x part non rénovée). */
  function facteurDerive(p, plan, an) {
    const P = vue(p);
    // charges.derive_entretien_an (cs.h5.derive_entretien_pct_an)
    const d = nombre(P.charges.derive_entretien_an);
    let f = 1.0;
    for (let k = 1; k < an; k++) f *= 1 + d * partNonRenovee(P, plan, k);
    return f;
  }

  /** Gestes individuels actifs dans la situation (toutes les situations, y compris S0 et le vote reporté, depuis le
   *  29/09/2026 ; Perso reste = Lot par lot + gestes) : liste de {gid, an, g (paramètres du geste)}. */
  function gestesActifs(p, plan) {
    const P = vue(p);
    const out = [];
    const gestes = plan.config.gestes || {};
    for (const gid of Object.keys(gestes)) {
      const g = gestes[gid];
      if (g && g.on) {
        const gi = P.gestes[gid];
