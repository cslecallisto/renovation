        const an = entier(g.annee || (has(gi, "annee_defaut") ? gi.annee_defaut : 1));
        out.push({ gid: gid, an: an, g: gi });
      }
    }
    return out;
  }

  /** Correspondance {ite, occultations, toiture} -> identifiants des lots du programme
   *  (gestes_individuels.clim_reversible.facteur_froid_enveloppe.lots) ; {} si le bloc est absent (réglages du 21/07). */
  function lotsEnveloppe(p) {
    const P = vue(p);
    const f = P.gestes.clim_reversible.facteur_froid_enveloppe;
    return f ? Object.assign({}, f.lots) : {};
  }

  /** Lots du programme réalisés à l'année an (composition réalisée, année par année) : programme à partir de l'année
   *  d'effet, après le chantier (la toiture refaite à part ne compte pas) ; Réparer seulement : la chaudière une fois remplacée ; Lot par lot / Perso :
   *  lots dont l'événement est passé, SAUF le ravalement (« Ravalement 1 simple », sans isolation : il ne réalise pas P3a) ;
   *  S0 : rien. Miroir de model_v2.lots_realises_an. */
  function lotsRealisesAn(p, plan, an) {
    const P = vue(p);
    if (plan.programme) return an >= entier(plan.programme.annee_effet) ? plan.programme.composition.slice() : [];
    const ans = {};
    for (const e of plan.evenements) ans[e.id] = e.annee;
    if (plan.situation === "SUBIR") return (has(ans, "chaudiere") && ans.chaudiere <= an) ? ["P2"] : [];
    return Object.keys(P.lots).filter((lotId) => {
      const ev = P.lots[lotId].evenement_lpl;
      return !estNul(ev) && has(ans, ev) && ev !== "ravalement" && ans[ev] <= an;
    });
  }

  /** Facteur multiplicatif du froid de la clim réversible selon les lots réalisés (D1 ; hypothese_cs:classeur_module_climat_facteur_enveloppe) :
   *  murs non isolés 1,00 ; ITE 0,68 ; ITE + occultations 0,50 ; ITE + occultations + toiture 0,44 ; 1,00 si le bloc est absent. */
  function facteurFroidEnveloppe(p, realises) {
    const P = vue(p);
    const f = P.gestes.clim_reversible.facteur_froid_enveloppe;
    if (!f) return 1.0;
    const L = f.lots;
    if (realises.indexOf(L.ite) < 0) return nombre(f.sans_ite);
    if (realises.indexOf(L.occultations) < 0) return nombre(f.ite);
    if (realises.indexOf(L.toiture) < 0) return nombre(f.ite_occultations);
    return nombre(f.ite_occultations_toiture);
  }

  /** Gain de l'isolation intérieure sur la part répartiteurs (D4) : gain_conso_logement (15 %) sans ITE réalisée,
   *  gain_apres_ite (3 %, hypothese_cs:note_etude_29_09_2026_iti_apres_ite_3pct) les années où l'ITE est réalisée. */
  function gainIti(p, realises) {
    const P = vue(p);
    const iti = P.gestes.iti;
    const lotIte = lotsEnveloppe(P).ite;
    if (!estNul(lotIte) && realises.indexOf(lotIte) >= 0 && !estNul(iti.gain_apres_ite)) return nombre(iti.gain_apres_ite);
    return nombre(iti.gain_conso_logement);
  }

  /** La valeur des m² perdus par l'isolation intérieure est-elle comptée dans le solde ? config.gestes.iti.compter_m2 s'il est
   *  renseigné, sinon gestes_individuels.iti.valeur_m2_perdus_comptee (D3 ; hypothese_cs:m2_perdus_monetises_29_09_2026). */
  function m2PerdusComptes(p, config) {
    const P = vue(p);
    const g = (config.gestes || {}).iti || {};
    if (!estNul(g.compter_m2)) return !!g.compter_m2;
    return !!P.gestes.iti.valeur_m2_perdus_comptee;
  }

  /** Effet des gestes individuels sur l'énergie du logement l'année an : {eco (économie de gaz), elec (électricité de la
   *  clim, chauffage + froid), froid_mwh, froid_eur, chauffage_eur, facteur_froid, gain_iti}. Convention 30/70 sur la part
   *  répartiteurs ; froid = froid_mwh_logement x facteur d'enveloppe de la composition réalisée l'année an. */
  function energieGestes(p, plan, typo, an, prixGaz) {
    const P = vue(p);
    const realises = lotsRealisesAn(P, plan, an);
    const ff = facteurFroidEnveloppe(P, realises);
    const gIti = gainIti(P, realises);
    const vide = { eco: 0.0, elec: 0.0, froid_mwh: 0.0, froid_eur: 0.0, chauffage_eur: 0.0, facteur_froid: ff, gain_iti: gIti };
    const actifs = gestesActifs(P, plan).filter((x) => x.an <= an);
    if (!actifs.length) return vide;
    const gi = P.gestes;
    const qp = quotePart(P, typo);
    const conso = P.energie.conso_gaz_mwh_an;
    const variable = prixGazAnnee(prixGaz, an).variable;
    const gazMwh = conso * (1 - plan.gain_facture[an]);
    const varPart = gazMwh * variable;
    // gestes_individuels.part_gaz_repartiteur (cs.clim.convention_30_70)
    const rep = nombre(gi.part_gaz_repartiteur);
    let facteur = 1.0;
    let clim = null;
    for (const x of actifs) {
      if (x.gid === "clim_reversible") clim = x.g;
      else if (x.gid === "iti") facteur *= 1 - gIti;
      // gain_conso_logement : fenetres (hypothese_cs:conventions_fenetres_15pct), robinets (avp.p127.robinets_gain_mwh)
      else facteur *= 1 - nombre(x.g.gain_conso_logement);
    }
    if (clim) {
      const pe = prixElec(P, an);
      const ecoGaz = rep * qp * varPart;
      // clim_reversible : froid_mwh_logement (hypothese_cs:froid_480_kwh_enveloppe_non_isolee_29_09_2026) x facteur d'enveloppe ;
      // rendement_chaudiere (avp.p107.rendement_combustion_pct), scop_chauffage (cs.clim.scop)
      const froidMwh = nombre(clim.froid_mwh_logement) * ff;
      const chaleurMwh = qp * gazMwh * facteur * nombre(clim.rendement_chaudiere) / nombre(clim.scop_chauffage);
      // même ordre d'opérations que la version du 21/07 (électricité totale au bit près) ; composantes pour l'affichage
      const elec = (chaleurMwh + froidMwh) * pe;
      return { eco: ecoGaz, elec: elec, froid_mwh: froidMwh, froid_eur: froidMwh * pe, chauffage_eur: chaleurMwh * pe, facteur_froid: ff, gain_iti: gIti };
    }
    vide.eco = (1 - facteur) * rep * qp * varPart;
    return vide;
  }

  /** Toutes les sorties d'une situation pour une typologie : blocs annuels, solde, valeur, KPI,
   *  sorties collectives. Séries en sortie : longueur H, index 0 = année 1. */
  function calculer(p, situation, typo, config, plan) {
    const P = vue(p);
    const H = P.H;
    plan = plan || planSituation(P, situation, config);
    const c = plan.config;
    const qp = quotePart(P, typo);
    const pg = choisirPrixGaz(P, c.variante_gaz);
    const ch = P.charges;
    // charges.blocs_2025 : structure (ged2025.calc.blocs), entretien_hors_p2 (derive ged2025.calc.blocs moins P2),
    // p2_chaudiere (ged2025.p11.p2_e2s_contrat), energie_elec_communs (ged2025.calc.elec_communs)
    const b25 = ch.blocs_2025;
    // charges.indexation_structure_an (cs.h5.indexation_structure_pct_an) ; indexation_elec_communs_an (cs.h5.elec_communs_invariante)
    const idx = nombre(ch.indexation_structure_an);
    const idxE = nombre(ch.indexation_elec_communs_an);
    const flux = fluxFinancementInterne(P, plan, typo);
    const blocs = {};
    for (const b of BLOCS) blocs[b] = zeros(H + 1);
    const total = zeros(H + 1), cumul = zeros(H + 1);
    const factureSit = zeros(H + 1), factureS0 = zeros(H + 1), ecoGestes = zeros(H + 1), elecGestes = zeros(H + 1);
    const froidMwh = zeros(H + 1), froidEur = zeros(H + 1), chauffageClim = zeros(H + 1), facteurFroid = zeros(H + 1), gainItiAn = zeros(H + 1);
    // charges.p2_apres_travaux : chaudiere (rao.p30.lot11.p2_e2s_ttc_an), ventilation (rao.p28.lot10.p2_immopartner_ttc_an)
    const p2Apres = ch.p2_apres_travaux;
    for (let an = 1; an <= H; an++) {
      const ix = Math.pow(1 + idx, an - 1);
      blocs.structure[an] = b25.structure * ix * qp;
      const entretien = b25.entretien_hors_p2 * ix * facteurDerive(P, plan, an);
      const p2 = ((plan.an_chaudiere_neuve !== null && an >= plan.an_chaudiere_neuve) ? p2Apres.chaudiere : b25.p2_chaudiere) * ix;
      const p2v = (plan.an_vmc !== null && an >= plan.an_vmc) ? p2Apres.ventilation * ix : 0.0;
      // charges.entretien_bso_par_logement_eur_an (hypothese_cs:entretien_bso_15_eur_logement_an_20_07_non_source)
      // entretien des BSO à partir de l'année d'effet du programme (après le chantier ; décision du 02/10/2026)
      const anBso = plan.programme ? plan.programme.annee_effet : 1;
      const bso = (plan.bso && an >= anBso) ? nombre(ch.entretien_bso_par_logement_eur_an) * ix : 0.0;
      blocs.entretien[an] = (entretien + p2 + p2v) * qp + bso;
      factureSit[an] = factureGaz(P, plan.gain_facture[an], an, pg);
      factureS0[an] = factureGaz(P, 0.0, an, pg);
      const eg = energieGestes(P, plan, typo, an, pg);
      ecoGestes[an] = eg.eco;
      elecGestes[an] = eg.elec;
      froidMwh[an] = eg.froid_mwh; froidEur[an] = eg.froid_eur; chauffageClim[an] = eg.chauffage_eur;
      facteurFroid[an] = eg.facteur_froid; gainItiAn[an] = eg.gain_iti;
      blocs.energie[an] = (factureSit[an] + b25.energie_elec_communs * Math.pow(1 + idxE, an - 1)) * qp - eg.eco + eg.elec;
      blocs.credits[an] = flux.credits[an];
      blocs.comptant[an] = flux.comptant[an];
      let t = 0;
      for (const b of BLOCS) t += blocs[b][an];
      total[an] = t;
      cumul[an] = cumul[an - 1] + total[an];
    }

    // --- solde net à la revente (photo à la revente, généralisée)
    const engs = flux.engagements;
    const chutes = engs.map((e) => travauxRevente(P, plan, e, typo, H));
    const pv = plan.pv;
    const vl = valeurLot(P, typo);
    const solde = zeros(H + 1), valeur = zeros(H + 1), valeurNette = zeros(H + 1);
    // valeur des m² perdus (isolation intérieure) : ligne séparée du solde, dès l'année de pose de l'ITI, si comptée (D3) ;
    // valeur perdue l'année de vente = valeur du logement cette année-là x perte_m2 / surface_m2 (gestes_individuels.iti.perte_m2_par_typologie)
    let anIti = null;
    for (const x of gestesActifs(P, plan)) {
      if (x.gid === "iti") anIti = x.an;
    }
    let ratioM2 = 0.0;
    if (anIti !== null && m2PerdusComptes(P, c)) {
      ratioM2 = nombre(P.gestes.iti.perte_m2_par_typologie[typo]) / nombre(P.immobilier.typologies[typo].surface_m2);
    }
    const m2Perdus = zeros(H + 1);
    const dec = { economies_collectives: zeros(H + 1), economies_gestes: zeros(H + 1), plus_value_dans_solde: zeros(H + 1),
                  travaux_payes: zeros(H + 1), valeur_m2_perdus_iti: m2Perdus };
    let ecoCumul = 0.0;
    let ecoIndivCumul = 0.0;
    for (let an = 1; an <= H; an++) {
      ecoCumul += (factureS0[an] - factureSit[an]) * qp;
      ecoIndivCumul += ecoGestes[an] - elecGestes[an];
      let pvSolde, pvDyn;
      if (pv.type === "renov") {
        if (an < pv.an_effet) {
          // avant l'année d'effet (attente du vote reporté, chantier) : même chemin de valeur que sans programme
          // (correctif du 28/09/2026 pour l'attente ; décision du 02/10/2026 pour les années du chantier)
          pvSolde = vl * pv.pct_s0 * an / H;
          pvDyn = pv.pct_s0 * an / H;
        } else {
          const fAn = an === pv.an_travaux ? pv.phi : 1.0;
          pvSolde = vl * pv.pct * (pv.phi_solde ? fAn : 1.0);
          pvDyn = pv.pct * fAn;
        }
      } else if (pv.type === "lxl") {
        const av = avancementLxl(P, pv.variante, an, pv.ids);
        pvSolde = vl * pv.pct * an / H;
        pvDyn = pv.pct_s0 * (an / H) * (1.0 - av) + pv.pct * av;
      } else if (pv.type === "par_lot") {
        // 06/10/2026 : le chemin de valeur lot par lot, le même dans la valeur affichée et dans le solde
        pvSolde = vl * pv.chemin[an];
        pvDyn = pv.chemin[an];
      } else {
        pvSolde = vl * pv.pct * an / H;
        pvDyn = pv.pct * an / H;
      }
      valeur[an] = vl * (1.0 + pvDyn);
      valeurNette[an] = valeur[an] - flux.crd[an];
      let s = ecoCumul + ecoIndivCumul + pvSolde;
      let payes = 0.0;
      for (const serie of chutes) {
        s -= serie[an];
        payes += serie[an];
      }
      if (ratioM2 && an >= anIti) {
        m2Perdus[an] = valeur[an] * ratioM2;
        s -= m2Perdus[an];
      }
      solde[an] = s;
      dec.economies_collectives[an] = ecoCumul;
      dec.economies_gestes[an] = ecoIndivCumul;
      dec.plus_value_dans_solde[an] = pvSolde;
      dec.travaux_payes[an] = payes;
    }

    let Hk = P.Hk;
    Hk = Math.min(Hk, H);
    let aidesTot = 0, qpTravaux = 0, qpSubis = 0;
    for (const e of engs) {
      aidesTot += e.aides;
      if (e.type === "programme") qpTravaux += e.montant;
      if (e.type === "subi" || e.type === "residuel") qpSubis += e.montant;
    }
    const kpi = {
      mensualite_moyenne_pendant_pret: flux.mensualite_moyenne_pendant_pret,
      mensualite_max: flux.mensualite_max,
      appel_comptant: flux.appel_comptant_total,
      interets_totaux: flux.interets_totaux,
      aides: aidesTot,
      quote_part_travaux: qpTravaux,
      quote_part_subis: qpSubis,
      gain_energie_pct: plan.gain_facture[H] * 100.0,
      cep: plan.cep.cep_proj, etiquette: plan.cep.classe, gain_cep_pct: plan.cep.gain,
      cep_certifie: plan.cep.certifie, cep_badge: plan.cep.badge,
      cout_total_kpi: cumul[Hk], cout_total_horizon: cumul[H],
      valeur_kpi: valeur[Hk], valeur_horizon: valeur[H],
      solde_kpi: solde[Hk], solde_horizon: solde[H],
      economie_an1: (factureS0[1] - factureSit[1]) * qp + ecoGestes[1] - elecGestes[1],
      economie_an10: H >= 10 ? (factureS0[10] - factureSit[10]) * qp + ecoGestes[10] - elecGestes[10] : null,
      facture_energie_an1: blocs.energie[1], charges_totales_an1: total[1],
      horizon_kpi_ans: Hk, horizon_ans: H,
      // valeur des m² perdus par l'isolation intérieure à l'horizon (ligne séparée du solde ; 0 sans ITI ou non comptée)
      valeur_m2_perdus_iti: m2Perdus[H], m2_perdus_iti: (anIti !== null ? nombre(P.gestes.iti.perte_m2_par_typologie[typo]) : 0.0),
    };
    const blocsSortie = {};
    for (const b of BLOCS) blocsSortie[b] = s1(blocs[b]);
    return {
      situation: situation, typo: typo, libelle: plan.libelle, affiche: plan.affiche,
      config: c, programme: plan.programme, engagements: engs, financement: exposerFlux(flux),
      blocs: blocsSortie, total: s1(total), cumul: s1(cumul),
      facture_gaz_collective: s1(factureSit), facture_gaz_s0: s1(factureS0),
      gestes: { economie_gaz: s1(ecoGestes), electricite_clim: s1(elecGestes), froid_clim_mwh: s1(froidMwh), froid_clim: s1(froidEur),
                chauffage_clim: s1(chauffageClim), facteur_froid: s1(facteurFroid), gain_iti: s1(gainItiAn), valeur_m2_perdus_iti: s1(m2Perdus) },
      decomposition_solde: s1Objet(dec),
      solde: s1(solde), valeur: s1(valeur), valeur_nette_dette: s1(valeurNette), kpi: kpi,
      gain_facture: s1(plan.gain_facture),
      collectif: sortiesCollectives(P, plan),
      plan: plan,
    };
  }

  /** Les cinq blocs de charges, le total et le cumul (années 1..H, index 0 = année 1). */
  function blocsCharges(p, situation, typo, config) {
    const r = calculer(p, situation, typo, config);
    return Object.assign({}, r.blocs, { total: r.total, cumul: r.cumul });
  }

  // ============================================================================
  // 10. SORTIES COLLECTIVES (section 9 du Python)
  // ============================================================================

  /** Cash collectif annuel (copropriété entière, convention interne index = année) : facture gaz +
   *  financement des travaux (mêmes prêts appliqués à 100 % des tantièmes) ; résiduel post-horizon. */
  function fluxCollectifs(p, plan) {
    const P = vue(p);
    const H = P.H;
    const c = plan.config;
    const pg = choisirPrixGaz(P, c.variante_gaz);
    const flux = zeros(H + 1);
    for (let an = 1; an <= H; an++) flux[an] += factureGaz(P, plan.gain_facture[an], an, pg);
    const prets = [];
    let residuel = 0.0;
    const comptant = zeros(H + 1);
    const engs = [];
    if (plan.programme) {
      const pr = plan.programme;
      // aides.reactives.nb_logements (avp.p4.logements)
      const nb = nombre(P.aides.reactives.nb_logements);
      const eng = { id: "programme", type: "programme", annee: pr.annee_travaux, montant: nombre(pr.capex.ttc), aides: nombre(pr.aides.total), ecoptz: Object.assign({}, pr.ecoptz) };
      let cpt;
      if (c.plan_aide === "historique_avp" && c.mode_collectif === "aide") {
        // financement.plan_aide_historique_avp.collectif (qp.p2.ptz_taux_pct, qp.p2.ptz_duree_ans ; annuités annuelles)
        const h = P.financement.plan_aide_historique_avp.collectif;
        const net = eng.montant - eng.aides;
        const pc = pret("collectif", "annuité unique (classeur)", net, h.taux, h.duree_ans, h.periodicite, eng.annee, "collectif");
        if (pc) prets.push(pc);
        cpt = 0.0;
      } else {
        eng.ecoptz.plafond_eur = nombre(eng.ecoptz.plafond_eur) * nb;
        const cfg = Object.assign({}, c);
        cfg.eligible_ecoptz = true;
        const r = pretsProgramme(P, eng, cfg);
        for (const x of r.prets) prets.push(x);
        cpt = r.comptant;
      }
      comptant[eng.annee] += cpt;
      engs.push(eng);
    }
    for (const ev of plan.evenements) {
      const eng = { id: "ev:" + ev.id, type: ev.type, libelle: ev.libelle, annee: ev.annee, montant: ev.montant * ev.proba, aides: ev.aides * ev.proba, reglage: ev.reglage };
      const r = pretsEvenement(P, eng);
      for (const x of r.prets) prets.push(x);
      if (eng.annee >= 1 && eng.annee <= H) comptant[eng.annee] += r.comptant;
      engs.push(eng);
    }
    for (const pr of prets) {
      const per = pr.periodicite, n = pr.n_periodes, m0 = (pr.an_debut - 1) * pr.periodicite;
      for (let an = 1; an <= H; an++) {
        const debut = (an - 1) * per, fin = an * per - 1;
        const k = Math.max(0, Math.min(fin, m0 + n - 1) - Math.max(debut, m0) + 1);
        flux[an] += k * pr.paiement;
      }
      const payesH = Math.max(0, Math.min(n, H * per - m0));
      residuel += (n - payesH) * pr.paiement;
    }
    for (let an = 1; an <= H; an++) flux[an] += comptant[an];
    return { flux: flux, residuel: residuel, prets: prets, comptant: comptant, engagements: engs };
  }

  function pvCollective(p, plan, an) {
    const P = vue(p);
    const H = P.H;
    const pv = plan.pv;
    if (pv.type === "renov") {
      if (an < pv.an_effet) return basePatrimoine(P) * pv.pct_s0 * an / H;
      return basePatrimoine(P) * pv.pct * ((an === pv.an_travaux && pv.phi_solde) ? pv.phi : 1.0);
    }
    if (pv.type === "par_lot") return basePatrimoine(P) * pv.chemin[an];
    return basePatrimoine(P) * pv.pct * an / H;
  }

  /** Capex, aides, reste à charge, cash et coût total réel (CTR = cash - plus-value) à H et à
   *  l'horizon KPI. `flux` et `comptant` en sortie : index 0 = année 1. */
  function sortiesCollectives(p, plan) {
    const P = vue(p);
    const H = P.H;
    const Hk = Math.min(P.Hk, H);
    const fc = fluxCollectifs(P, plan);
    const cashH = somme(fc.flux.slice(1, H + 1)) + fc.residuel;
    const cashK = somme(fc.flux.slice(1, Hk + 1));
    let subis = 0;
    for (const e of fc.engagements) {
      if (e.type !== "programme") subis += e.montant;
    }
    const out = {
      cash_horizon: cashH, ctr_horizon: cashH - pvCollective(P, plan, H),
      cash_kpi: cashK, ctr_kpi: cashK - pvCollective(P, plan, Hk),
      residuel_post_horizon: fc.residuel, flux: s1(fc.flux), comptant: s1(fc.comptant),
      plus_value_collective_horizon: pvCollective(P, plan, H),
      travaux_subis_total: subis,
      capex: null, aides: null, reste_a_charge: null,
    };
    if (plan.programme) {
      const pr = plan.programme;
      out.capex = pr.capex.ttc;
      out.aides = pr.aides.total;
      out.reste_a_charge = pr.reste_a_charge;
    }
    return out;
  }

  /** Toutes les situations x typologies pour une configuration ; sorties collectives par situation. */
  function calculerTout(p, config, situations, typos) {
    const P = vue(p);
    // Python : `situations or SITUATIONS` (une liste vide vaut « toutes les situations affichées »)
    situations = (situations && situations.length) ? situations : SITUATIONS;
    typos = (typos && typos.length) ? typos : typologies(P);
    const out = { situations: {}, collectif: {} };
    for (const s of situations) {
      const plan = planSituation(P, s, config);
      out.situations[s] = {};
      for (const t of typos) out.situations[s][t] = calculer(P, s, t, config, plan);
      out.collectif[s] = sortiesCollectives(P, plan);
    }
    return out;
  }

  // ============================================================================
  // 11. RÉSUMÉ ET AUTOTEST (goldens du bloc precalcul)
  // ============================================================================

  const CLES_PRET = ["id", "libelle", "type", "capital", "taux", "duree_ans", "paiement", "periodicite", "an_debut", "total_paye", "interets"];
  const CLES_ENGAGEMENT = ["id", "type", "libelle", "annee", "montant", "aides", "proba"];

  /** Sous-ensemble compact d'un résultat de `calculer`, au format du bloc `precalcul.situations`. */
  function resume(res) {
    const fin = res.financement;
    return {
      blocs: res.blocs, total: res.total, cumul: res.cumul,
      solde: res.solde, valeur: res.valeur, valeur_nette_dette: res.valeur_nette_dette,
      crd: fin.crd, mensualite_equivalente: fin.mensualite_equivalente,
      credits_par_type: fin.credits_par_type,
      prets: fin.prets.map((pr) => choisir(pr, CLES_PRET)),
      engagements: res.engagements.map((e) => choisir(e, CLES_ENGAGEMENT)),
      kpi: res.kpi,
    };
  }

  /** Recalcule la configuration par défaut (5 situations x 6 typologies, sorties collectives,
   *  programme par défaut, exemple Perso clim) et compare au bloc `precalcul` du contrat : nombres
   *  au centime (|écart| <= 0,005), textes, booléens et null à l'identique.
   *  Retourne {ok, tot (valeurs comparées), fails [{chemin, attendu, obtenu, ecart}], precision}. */
  // ----------------------------------------------------------------------------
  // Incertitudes propres au programme et repère d'échafaudage (décisions du CS du 28/09/2026)
  // ----------------------------------------------------------------------------
  const CAS_INCERTITUDES = ["central", "mpr_refusee", "depassement", "les_deux"];

  /** Vue où le prix des travaux du programme dépasse de situations.RENOV.incertitudes.depassement (10 %) au-delà
   *  des imprévus déjà comptés : (1 + aléas) x (1 + dépassement). */
  function paramsDepassement(p) {
    const P = vue(p);
    // situations.RENOV.incertitudes.depassement (hypothese_cs:depassement_10pct_illustratif_28_09_2026)
    const d = nombre(P.situations.RENOV.incertitudes.depassement);
    const co = P.programme.coefficients;
    const aleas = (1 + nombre(co.aleas)) * (1 + d) - 1;
    const coefs = Object.assign({}, co, { aleas: aleas, coef_ttc: Math.round((1 + aleas) * (1 + nombre(co.honoraires)) * 1e6) / 1e6 });
    return Object.assign({}, P, { programme: Object.assign({}, P.programme, { coefficients: coefs }) });
  }

  /** « Voter en 2026 » et ses aléas propres : central ; MaPrimeRénov' refusée (aides sans MPR Copro travaux ni AMO) ;
   *  dépassement de 10 % (aides du dossier inchangées) ; les deux. Retourne {cas: résultat de calculer()}. */
  function incertitudesProgramme(p, typo, config) {
    const P = vue(p);
    const c = configEffective(P, config);
    const aidesC = aidesProgramme(P, c.composition, c.source_prix, c.aides_override).total;
    const a = aidesProgramme(P, c.composition, c.source_prix, null), det = a.detail || {};
    let fs = 1.0;
    if (!estNul(c.aides_override)) fs = a.total ? nombre(c.aides_override) / a.total : 1.0;
    // même définition que « MPR perdue » (aides_report du Python, facteur de report 1 pour un vote en 2026)
    const sansMpr = (a.total - nombre(det.mpr_travaux || 0) - nombre(det.mpr_amo || 0)) * 1.0 * fs;
    const Q = paramsDepassement(P);
    const cfgMpr = copie(config || {}); cfgMpr.aides_override = sansMpr;
    const cfgDep = copie(config || {}); cfgDep.aides_override = aidesC;
    return { central: calculer(P, "RENOV", typo, config), mpr_refusee: calculer(P, "RENOV", typo, cfgMpr),
             depassement: calculer(Q, "RENOV", typo, cfgDep), les_deux: calculer(Q, "RENOV", typo, cfgMpr) };
  }

  /** Repère : un montage d'échafaudage des façades (RAO p. 10, lot 1), avec les frais d'un chantier, pour la
   *  quote-part du logement, aux prix d'aujourd'hui. */
  function echafaudageLogement(p, typo) {
    const P = vue(p);
    // calendriers.echafaudage_facades (rao.p10.lot01.installation_chantier_champagne_facades_ht)
    const e = P.calendriers.echafaudage_facades, f = P.calendriers.frais_chantiers_separes;
    const coef = (1 + nombre(f.aleas)) * (1 + nombre(f.honoraires));
    return nombre(e.ttc) * coef * quotePart(P, typo);
  }

  // ----------------------------------------------------------------------------
  // Fourchette « ce qui sera voté » : base seule <-> base + les options (décision du CS du 28/09/2026)
  // ----------------------------------------------------------------------------

  /** {base, active, complet} : la composition sans les options (la toiture reste si la règle l'impose), telle que
   *  réglée, et avec toutes les options proposées (programme.ordre_options). */
  function compositionsFourchette(p, composition) {
    const P = vue(p);
    const opts = P.programme.ordre_options.slice();
    const active = normaliserComposition(P, composition);
    let base = normaliserComposition(P, active.filter((x) => opts.indexOf(x) < 0));
    if (!compositionValide(P, base).valide && active.indexOf("P6a") >= 0) base = normaliserComposition(P, base.concat(["P6a"]));
    const complet = normaliserComposition(P, active.concat(opts));
    return { base: base, active: active, complet: complet };
  }

  /** Un montant d'aides imposé vaut FACTEUR sur les aides calculées : transposé à une autre composition. */
  function aidesOverridePour(p, c, composition) {
    const P = vue(p);
    if (estNul(c.aides_override)) return null;
    const tot = aidesProgramme(P, c.composition, c.source_prix, null).total;
    const fs = tot ? nombre(c.aides_override) / tot : 1.0;
    return aidesProgramme(P, composition, c.source_prix, null).total * fs;
  }

  /** « Voter en 2026 » : résultats de calculer() pour base, active, complet (mêmes réglages). */
  function fourchetteProgramme(p, typo, config) {
    const P = vue(p);
    const c = configEffective(P, config);
    const comps = compositionsFourchette(P, c.composition);
    const out = {};
    for (const k of Object.keys(comps)) {
      const cfg = copie(config || {});
      cfg.composition = comps[k];
      cfg.aides_override = aidesOverridePour(P, c, comps[k]);
      out[k] = calculer(P, "RENOV", typo, cfg);
    }
    return out;
  }

  /** « Voter plus tard » (paramètres déjà reportés par l'hôte : annee_travaux, prix indexés) : l'hôte fournit
   *  `calculerReport(cfg, cas)` qui rend le résultat d'une configuration et d'un cas d'aides ; ici on prépare les
   *  configurations des trois compositions et on retourne {base_<cas>, active_<cas>, complet_<cas>}. */
  function fourchetteReport(p, config, casAides, calculerReport) {
    const P = vue(p);
    const c = configEffective(P, config);
    const comps = compositionsFourchette(P, c.composition);
    const out = {};
    for (const k of Object.keys(comps)) {
      for (const cas of casAides) {
        const cfg = copie(config || {});
        cfg.composition = comps[k];
        cfg.aides_override = aidesOverridePour(P, c, comps[k]);
        out[k + "_" + cas] = calculerReport(cfg, cas, comps[k]);
      }
    }
    return out;
  }

  /** Borne basse et haute d'un dictionnaire {étiquette: résultat} sur une série (index JS : 0 = année 1). */
  function bornes(resultats, cle, index) {
    const vals = {};
    let kmin = null, kmax = null;
    for (const k of Object.keys(resultats)) {
      const serie = resultats[k][cle || "solde"];
      const v = serie[index === undefined ? serie.length - 1 : index];
      vals[k] = v;
      if (kmin === null || v < vals[kmin]) kmin = k;
      if (kmax === null || v > vals[kmax]) kmax = k;
    }
    return { min: { cle: kmin, valeur: vals[kmin] }, max: { cle: kmax, valeur: vals[kmax] }, valeurs: vals };
  }

  // ----------------------------------------------------------------------------
  // « Voter plus tard » dans le module (miroir de facteur_report, params_report, aides_report, calculer_report du Python ;
  // même recette que l'hôte du simulateur : copie de la vue avec les prix des lots indexés, chantier l'année qui suit le vote)
  // ----------------------------------------------------------------------------

  /** Indexation des prix entre le vote de 2026 et le vote reporté : (1 + inflation BTP)^(années de report). */
  function facteurReport(p, anneeVote) {
    const P = vue(p);
    // situations.RENOV.report.annee_vote_programme (cs.age_30_11_2026) ; calendriers.inflation_btp_an
    const an0 = entier(P.situations.RENOV.report.annee_vote_programme);
    return Math.pow(1 + nombre(P.calendriers.inflation_btp_an), entier(anneeVote) - an0);
  }

  /** Vue pour « Voter plus tard » : même programme voté en anneeVote, chantier l'année suivante, prix des lots indexés (BTP),
   *  entretien stabilisé à partir du chantier. */
  function paramsReport(p, anneeVote) {
    const P = vue(p);
    const an0 = entier(P.situations.RENOV.report.annee_vote_programme);
    const n = entier(anneeVote) - an0;
    const f = facteurReport(P, anneeVote);
    const lotsQ = {};
    for (const k of Object.keys(P.lots)) {
      const lot = Object.assign({}, P.lots[k]);
      if (!estNul(lot.montant_rao)) lot.montant_rao = nombre(lot.montant_rao) * f;
      if (!estNul(lot.montant_avp)) lot.montant_avp = nombre(lot.montant_avp) * f;
      if (!estNul(lot.montant_odj)) lot.montant_odj = nombre(lot.montant_odj) * f;
      lotsQ[k] = lot;
    }
    const situations = Object.assign({}, P.situations, { RENOV: Object.assign({}, P.situations.RENOV, { annee_travaux: n + 1 }) });
    const charges = Object.assign({}, P.charges, { plateau_renov_des_annee: n + 1 });
    let programme = P.programme;
    if (P.programme.convention_odj) {
      // convention de la convocation : les coûts associés fixes suivent aussi l'indexation
      const ca = Object.assign({}, P.programme.convention_odj.couts_associes, { fixes_ttc: nombre(P.programme.convention_odj.couts_associes.fixes_ttc) * f });
      programme = Object.assign({}, P.programme, { convention_odj: Object.assign({}, P.programme.convention_odj, { couts_associes: ca }) });
    }
    return Object.assign({}, P, { lots: lotsQ, situations: situations, charges: charges, programme: programme });
  }

  /** Aides du programme reporté : celles d'aujourd'hui, indexées comme les prix ; cas « gardees » ou « mpr_perdue » (sans
   *  MaPrimeRénov' Copro travaux ni AMO) ; facteurAides : multiplicateur des aides d'aujourd'hui (aides imposées). */
  function aidesReport(p, composition, source, anneeVote, cas, facteurAides) {
    const P = vue(p);
    const a = aidesProgramme(P, composition, source, null), det = a.detail || {};
    const base = cas === "gardees" ? a.total : a.total - nombre(det.mpr_travaux || 0) - nombre(det.mpr_amo || 0);
    return base * facteurReport(P, anneeVote) * nombre(facteurAides === undefined ? 1.0 : facteurAides);
  }

  /** « Voter plus tard » pour un logement : calculer() (situation RENOV) sur la vue reportée, aides de la composition
   *  RÉALISÉE au chantier (un ouvrage refait à part avant le chantier sort du programme et de ses aides). */
  function calculerReport(p, typo, anneeVote, cas, config) {
    const P = vue(p);
    const c = configEffective(P, config);
    const Q = paramsReport(P, anneeVote);
    const cfg = copie(config || {});
    let fs = 1.0;
    if (!estNul(c.aides_override)) {
      const tot = aidesProgramme(P, c.composition, c.source_prix, null).total;
      fs = tot ? nombre(c.aides_override) / tot : 1.0;
    }
    const anT = entier(Q.situations.RENOV.annee_travaux);
    const compRealisee = compositionRealisee(Q, c.composition, c.calendrier, anT).composition;
    cfg.aides_override = aidesReport(P, compRealisee, c.source_prix, anneeVote, cas, fs);
    return calculer(Q, "RENOV", typo, cfg);
  }

  // ----------------------------------------------------------------------------
  // « Et chez moi, en plus ? » : bloc « gestes » (miroir de scenarios_gestes, resume_gestes, gestes_immeuble ; 29/09/2026)
  // ----------------------------------------------------------------------------

  /** Les cinq scénarios du bloc « gestes » : {clé: fonction(config) -> résultat de calculer()}. */
  function scenariosGestes(p, typo, config) {
    const P = vue(p);
    const c = configEffective(P, config);
    const comps = compositionsFourchette(P, c.composition);
    // situations.RENOV.report.annee_vote_defaut (hypothese_cs:report_central_5_ans_valide_27_09_2026)
    const V = entier(P.situations.RENOV.report.annee_vote_defaut);
    const renov = (comp) => (cfg) => {
      cfg = copie(cfg || {});
      cfg.composition = comp;
      cfg.aides_override = aidesOverridePour(P, c, comp);
      return calculer(P, "RENOV", typo, cfg);
    };
    const report = (comp) => (cfg) => {
      cfg = copie(cfg || {});
      cfg.composition = comp;
      cfg.aides_override = aidesOverridePour(P, c, comp);
      return calculerReport(P, typo, V, "gardees", cfg);
    };
    const out = {};
    out.V26_base = renov(comps.base);
    out.V26_complet = renov(comps.complet);
    out["VPT_" + String(V) + "_base"] = report(comps.base);
    out.REP = (cfg) => calculer(P, "SUBIR", typo, cfg);
    out.LPL = (cfg) => calculer(P, "LXL", typo, cfg);
    return out;
  }

  function avecGestes(config, gestes) {
    const cfg = copie(config || {});
    cfg.gestes = copie(gestes);
    return cfg;
  }

  /** Solde à l'année an (index JS : an - 1) sans les effets de valeur : ni la plus-value dans le solde, ni la valeur des m² perdus. */
  function tresorerieSeule(res, an) {
    const d = res.decomposition_solde;
    return res.solde[an - 1] - d.plus_value_dans_solde[an - 1] + d.valeur_m2_perdus_iti[an - 1];
  }

  /** Bloc « gestes » d'une typologie (même structure que precalcul.gestes du contrat) : effets de la clim réversible, de
   *  l'isolation intérieure (avec / sans m²), des fenêtres et de clim + ITI dans chacun des cinq scénarios ; gestes posés à
   *  leur année par défaut, payés comptant. */
  function resumeGestes(p, typo, config) {
    const P = vue(p);
    const H = P.H;
    const gi = P.gestes;
    const c = configEffective(P, config);
    const src = c.source_prix;
    const vl = valeurLot(P, typo);
    const perte = nombre(gi.iti.perte_m2_par_typologie[typo]);
    const surface = nombre(P.immobilier.typologies[typo].surface_m2);
    const anClim = entier(has(gi.clim_reversible, "annee_defaut") ? gi.clim_reversible.annee_defaut : 1);
    const anIti = entier(has(gi.iti, "annee_defaut") ? gi.iti.annee_defaut : 1);
    const anFen = entier(has(gi.fenetres, "annee_defaut") ? gi.fenetres.annee_defaut : 1);
    const a3 = Math.min(3, H), a10 = Math.min(10, H);
    const A = (serie, an) => serie[an - 1];
    const gClim = { clim_reversible: { on: true, annee: anClim } };
    const gIti = { iti: { on: true, annee: anIti } };
    const gItiSans = { iti: { on: true, annee: anIti, compter_m2: false } };
    const gFen = { fenetres: { on: true, annee: anFen } };
    const gClimIti = { clim_reversible: { on: true, annee: anClim }, iti: { on: true, annee: anIti } };
    const prix = { clim_reversible: prixGeste(P, "clim_reversible", typo, src), iti: prixGeste(P, "iti", typo, src), fenetres: prixGeste(P, "fenetres", typo, src) };
    const out = {
      reglage: { annees: { clim_reversible: anClim, iti: anIti, fenetres: anFen }, paiement: "comptant", source_prix: src,
                 annees_reperes: { an3: a3, an10: a10 }, horizon: H },
      prix: prix,
      iti_m2_perdus: perte, iti_valeur_m2_aujourdhui: vl * perte / surface,
      iti_gain_fourchette: (gi.iti.gain_fourchette || []).slice(), iti_prix_fourchette: gi.iti.fourchette_par_typologie[typo].slice(),
      scenarios: {},
    };
    const sc = scenariosGestes(P, typo, config);
    for (const cle of Object.keys(sc)) {
      const f = sc[cle];
      const r0 = f(config);
      const rc = f(avecGestes(config, gClim)), ri = f(avecGestes(config, gIti)), ris = f(avecGestes(config, gItiSans)),
            rf = f(avecGestes(config, gFen)), rci = f(avecGestes(config, gClimIti));
      const effet = (r) => ({ avec_valeur: A(r.solde, H) - A(r0.solde, H), tresorerie_seule: tresorerieSeule(r, H) - tresorerieSeule(r0, H) });
      const gc = rc.gestes, gci = ri.gestes;
      out.scenarios[cle] = {
        solde_sans_geste: A(r0.solde, H),
        clim_reversible: { prix: prix.clim_reversible, annee: anClim,
                           facteur_froid: { an3: A(gc.facteur_froid, a3), an10: A(gc.facteur_froid, a10) },
                           froid_mwh: { an3: A(gc.froid_clim_mwh, a3), an10: A(gc.froid_clim_mwh, a10) },
                           froid_eur: { an3: A(gc.froid_clim, a3), an10: A(gc.froid_clim, a10) },
                           chauffage_elec_eur: { an3: A(gc.chauffage_clim, a3), an10: A(gc.chauffage_clim, a10) },
                           gaz_efface_eur: { an3: A(gc.economie_gaz, a3), an10: A(gc.economie_gaz, a10) },
                           electricite_eur: { an3: A(gc.electricite_clim, a3), an10: A(gc.electricite_clim, a10) },
                           effet_bilan_30: effet(rc) },
        iti: { prix: prix.iti, annee: anIti,
               gain: { an3: A(gci.gain_iti, a3), an10: A(gci.gain_iti, a10) },
               economie_eur: { an3: A(gci.economie_gaz, a3), an10: A(gci.economie_gaz, a10) },
               m2_perdus: perte, valeur_m2_aujourdhui: vl * perte / surface, valeur_m2_horizon: A(gci.valeur_m2_perdus_iti, H),
               effet_bilan_30: { avec_m2: A(ri.solde, H) - A(r0.solde, H), sans_m2: A(ris.solde, H) - A(r0.solde, H),
                                 tresorerie_seule: effet(ri).tresorerie_seule } },
        fenetres: { prix: prix.fenetres, annee: anFen, economie_eur: { an3: A(rf.gestes.economie_gaz, a3), an10: A(rf.gestes.economie_gaz, a10) },
                    effet_bilan_30: effet(rf) },
        clim_iti: { electricite_eur_an3: A(rci.gestes.electricite_clim, a3), valeur_m2_horizon: A(rci.gestes.valeur_m2_perdus_iti, H),
                    effet_bilan_30: effet(rci) },
      };
    }
    return out;
  }

  /** « Tout le monde en ITI » à l'échelle de l'immeuble contre l'ITE du programme (miroir de gestes_immeuble). */
  function gestesImmeuble(p, source) {
    const P = vue(p);
    if (source === undefined) source = "rao";
    const gi = P.gestes, iti = gi.iti;
    const typos = P.immobilier.typologies;
    const conso = nombre(P.energie.conso_gaz_mwh_an);
    const gain = nombre(iti.gain_conso_logement);
    const rep = nombre(gi.part_gaz_repartiteur);
    let cout = 0.0, cMin = 0.0, cMax = 0.0, m2 = 0.0, valeur = 0.0, nb = 0;
    for (const t of Object.keys(typos)) {
      const n = entier(typos[t].nb_lots);
      nb += n;
      cout += nombre(iti.prix_par_typologie[t]) * n;
      cMin += nombre(iti.fourchette_par_typologie[t][0]) * n;
      cMax += nombre(iti.fourchette_par_typologie[t][1]) * n;
      m2 += nombre(iti.perte_m2_par_typologie[t]) * n;
      valeur += valeurLot(P, t) * nombre(iti.perte_m2_par_typologie[t]) / nombre(typos[t].surface_m2) * n;
    }
    const fourchette = (iti.gain_fourchette || [gain, gain]).map(nombre);
    const out = {
      iti_tous: { nb_logements: nb, cout_total: cout, cout_fourchette: [cMin, cMax], m2_perdus: m2, valeur_m2_aujourdhui: valeur,
                  mwh_an_repartiteurs: gain * rep * conso, mwh_an_physique: gain * conso,
                  mwh_an_fourchette_physique: [fourchette[0] * conso, fourchette[1] * conso], gain: gain, part_repartiteurs: rep },
      ite_programme: null,
    };
    const L = lotsEnveloppe(P);
    const lotIte = L.ite;
    const rav = P.calendriers.evenements.ravalement;
    if (lotIte && rav) {
      const co = coefficients(P);
      const pl = prixLot(P, lotIte, source);
      const lot = P.lots[lotIte];
      let induits = 0.0;
      for (const lid of Object.keys(P.lots)) {
        if (P.lots[lid].poste_avp_parent === lot.poste_avp_parent && lid !== lotIte) induits += prixLot(P, lid, source).montant;
      }
      const prog = compositionDefaut(P);
      const sans = prog.filter((x) => x !== lotIte);
      const aProg = aidesProgramme(P, prog, source, null).total;
      const aSans = aidesProgramme(P, sans, source, null).total;
      const ar = P.aides.reactives;
      const surcout = pl.montant - nombre(rav.prix_ttc);
      out.ite_programme = {
        lot: lotIte, libelle: lot.libelle, source_prix: pl.source_effective, offre_facades_ite_ttc: pl.montant,
        ravalement_simple_ttc: nombre(rav.prix_ttc), ravalement_libelle: rav.nom,
        surcout_travaux: surcout, surcout_frais_compris: surcout * co.ca * co.ch, coef_frais: co.ca * co.ch,
        lots_induits_ttc: induits, mwh_an: nombre(lot.mwh_avp || 0),
        aides: { mpr_travaux_sur_le_poste: nombre(ar.taux_mpr.gain_35) * nombre(ar.k) * assietteNuLot(P, lotIte, source),
                 programme: aProg, programme_sans_ite: aSans, conditionnees_par_ite: aProg - aSans },
      };
    }
    return out;
  }

  function autotest(p, options) {
    const P = vue(p);
    const tol = (options && typeof options.tolerance === "number") ? options.tolerance : 0.005 + 1e-6;
    const fails = [];
    let tot = 0;

    function cmp(a, b, chemin) {
      if (a === null || a === undefined) {
        tot++;
        if (!(b === null || b === undefined)) fails.push({ chemin: chemin, attendu: a, obtenu: b });
        return;
      }
      if (typeof a === "number") {
        tot++;
        if (typeof b !== "number" || !(Math.abs(a - b) <= tol)) {
          fails.push({ chemin: chemin, attendu: a, obtenu: b, ecart: typeof b === "number" ? b - a : null });
        }
        return;
      }
      if (typeof a === "boolean" || typeof a === "string") {
        tot++;
        if (a !== b) fails.push({ chemin: chemin, attendu: a, obtenu: b });
        return;
      }
      if (Array.isArray(a)) {
        if (!Array.isArray(b) || b.length !== a.length) {
          fails.push({ chemin: chemin, attendu: "liste de " + a.length, obtenu: Array.isArray(b) ? "liste de " + b.length : typeof b });
        }
        const n = Math.min(a.length, Array.isArray(b) ? b.length : 0);
        for (let i = 0; i < n; i++) cmp(a[i], b[i], chemin + "[" + i + "]");
        return;
      }
      if (typeof a === "object") {
        if (!b || typeof b !== "object") {
          fails.push({ chemin: chemin, attendu: "objet", obtenu: typeof b });
          return;
        }
        for (const k of Object.keys(a)) {
          if (k.charAt(0) === "_") continue;
          cmp(a[k], b[k], chemin + "." + k);
        }
      }
    }

    if (!P.precalcul) {
      return { ok: false, tot: 0, fails: [{ chemin: "precalcul", attendu: "bloc precalcul du contrat", obtenu: "absent" }], precision: P.precision };
    }
    const pre = P.precalcul;
    const cfg = configDefaut(P);
    const tout = calculerTout(P, cfg, SITUATIONS_TOUTES);
    for (const s of Object.keys(pre.situations || {})) {
      for (const t of Object.keys(pre.situations[s])) {
        const r = tout.situations[s] ? tout.situations[s][t] : null;
        if (!r) {
          fails.push({ chemin: "situations." + s + "." + t, attendu: "résultat", obtenu: "absent" });
          continue;
        }
        cmp(pre.situations[s][t], resume(r), "situations." + s + "." + t);
      }
    }
    for (const s of Object.keys(pre.collectif || {})) {
      const g = Object.assign({}, pre.collectif[s]);
      // les exports Python antérieurs au 23/09 07:39 laissaient l'index 0 (année 0, inutilisé) dans flux et
      // comptant du collectif ; alignement conservé par tolérance, sans effet sur un contrat à H valeurs
      for (const k of ["flux", "comptant"]) {
        if (Array.isArray(g[k]) && g[k].length === P.H + 1) g[k] = g[k].slice(1);
      }
      cmp(g, tout.collectif[s], "collectif." + s);
    }
    if (pre.programme_defaut) {
      cmp(pre.programme_defaut, tout.situations.RENOV[typologies(P)[0]].programme, "programme_defaut");
    }
    if (pre.PERSO_exemple_clim) {
      const cfgEx = configDefaut(P);
      cfgEx.gestes = copie(pre.PERSO_exemple_clim.config_gestes);
      const ex = calculerTout(P, cfgEx, ["PERSO"]);
      for (const t of Object.keys(pre.PERSO_exemple_clim.situations || {})) {
        cmp(pre.PERSO_exemple_clim.situations[t], resume(ex.situations.PERSO[t]), "PERSO_exemple_clim." + t);
      }
    }
    if (pre.incertitudes) {
      for (const t of Object.keys(pre.incertitudes)) {
        const inc = incertitudesProgramme(P, t, cfg), got = {};
        for (const k of Object.keys(inc)) {
          got[k] = { solde: inc[k].solde[P.H - 1], valeur: inc[k].valeur[P.H - 1], aides: inc[k].kpi.aides, quote_part: inc[k].kpi.quote_part_travaux };   // séries JS : index 0 = année 1
        }
        cmp(pre.incertitudes[t], got, "incertitudes." + t);
      }
    }
    if (pre.echafaudage_logement) {
      for (const t of Object.keys(pre.echafaudage_logement)) cmp(pre.echafaudage_logement[t], echafaudageLogement(P, t), "echafaudage_logement." + t);
    }
    if (pre.fourchettes_options) {
      // « Voter en 2026 » : base, active, complet (les « Voter plus tard » relèvent de l'hôte, qui reporte les paramètres)
      for (const t of Object.keys(pre.fourchettes_options)) {
        const att = pre.fourchettes_options[t];
        const fp = fourchetteProgramme(P, t, cfg);
        for (const k of Object.keys(att.V26 || {})) {
          const r = fp[k];
          if (!r) { fails.push({ chemin: "fourchettes_options." + t + ".V26." + k, attendu: "résultat", obtenu: "absent" }); continue; }
          cmp({ solde: att.V26[k].solde, valeur: att.V26[k].valeur, quote_part: att.V26[k].quote_part, aides: att.V26[k].aides, capex: att.V26[k].capex },
              { solde: r.solde[P.H - 1], valeur: r.valeur[P.H - 1], quote_part: r.kpi.quote_part_travaux, aides: r.kpi.aides, capex: r.programme ? r.programme.capex.ttc : null },
              "fourchettes_options." + t + ".V26." + k);
        }
        if (att.compositions) cmp(att.compositions, compositionsFourchette(P, cfg.composition), "fourchettes_options." + t + ".compositions");
      }
    }
    if (pre.gestes) {
      // « Et chez moi, en plus ? » : le bloc « gestes » de chaque typologie (cinq scénarios, dont « Voter plus tard » via calculerReport)
      for (const t of Object.keys(pre.gestes)) cmp(pre.gestes[t], resumeGestes(P, t, cfg), "gestes." + t);
    }
    if (pre.gestes_immeuble) cmp(pre.gestes_immeuble, gestesImmeuble(P, cfg.source_prix), "gestes_immeuble");
    return { ok: fails.length === 0, tot: tot, fails: fails, precision: P.precision };
  }

  return {
    // constantes structurelles
    SITUATIONS: SITUATIONS, SITUATIONS_TOUTES: SITUATIONS_TOUTES, BLOCS: BLOCS,
    // outils
    arrondiJs: arrondiJs, paiementPeriodique: paiementPeriodique, crdApres: crdApres,
    quotePart: quotePart, valeurLot: valeurLot, basePatrimoine: basePatrimoine, horizon: horizon, typologies: typologies,
    preparer: preparer, rafraichir: rafraichir,
    // programme
    lots: lots, ordreLots: ordreLots, lotsVerrouilles: lotsVerrouilles, compositionDefaut: compositionDefaut,
    compositionReference: compositionReference, normaliserComposition: normaliserComposition,
    compositionValide: compositionValide, prixLot: prixLot, coefficients: coefficients,
    conventionOdj: conventionOdj, coutsAssociesOdj: coutsAssociesOdj, quotePartCle: quotePartCle, quotePartProgramme: quotePartProgramme, aidesOdj: aidesOdj,
    capexProgramme: capexProgramme, prixPosteAvp: prixPosteAvp, capexScenarioAvp: capexScenarioAvp,
    // énergie
    gainFactureLot: gainFactureLot, gainFactureComposition: gainFactureComposition, gainComposition: gainFactureComposition,
    gainCep: gainCep, classeDpe: classeDpe, lotsEnergie: lotsEnergie, ancreCep: ancreCep, gainCepAffiche: gainCepAffiche,
    verdictSeuil: verdictSeuil, choisirPrixGaz: choisirPrixGaz, prixGazAnnee: prixGazAnnee, factureGaz: factureGaz, prixElec: prixElec,
    // aides
    ceeInterpole: ceeInterpole, assietteNuLot: assietteNuLot, aidesReactives: aidesReactives, ecoptzRegime: ecoptzRegime,
    aidesProgramme: aidesProgramme,
    // calendriers
    evenement: evenement, scopeCalendrier: scopeCalendrier, coefUrgence: coefUrgence, coefFraisChantier: coefFraisChantier, coutEvenement: coutEvenement,
    // incertitudes du programme et repère d'échafaudage (28/09/2026)
    CAS_INCERTITUDES: CAS_INCERTITUDES, paramsDepassement: paramsDepassement, incertitudesProgramme: incertitudesProgramme,
    echafaudageLogement: echafaudageLogement,
    // fourchette base seule / base + options (28/09/2026)
    compositionsFourchette: compositionsFourchette, compositionRealisee: compositionRealisee, dureeChantier: function (p) { return dureeChantier(vue(p)); }, aidesOverridePour: aidesOverridePour, fourchetteProgramme: fourchetteProgramme,
    fourchetteReport: fourchetteReport, bornes: bornes,
    avancementLxl: avancementLxl,
    // configuration et plans
    configDefaut: configDefaut, configEffective: configEffective, reglageLot: reglageLot, planSituation: planSituation,
    // financement
    engagementsLogement: engagementsLogement, prixGeste: prixGeste, pret: pret, pretsProgramme: pretsProgramme,
    pretsEvenement: pretsEvenement, fluxFinancement: fluxFinancement, totalPayeSolde: totalPayeSolde,
    // charges, gestes, calcul
    facteurDerive: facteurDerive, gestesActifs: gestesActifs, energieGestes: energieGestes,
    lotsEnveloppe: lotsEnveloppe, lotsRealisesAn: lotsRealisesAn, facteurFroidEnveloppe: facteurFroidEnveloppe, gainIti: gainIti, m2PerdusComptes: m2PerdusComptes,
    calculer: calculer, blocsCharges: blocsCharges,
    // « Voter plus tard » dans le module (29/09/2026)
    facteurReport: facteurReport, paramsReport: paramsReport, aidesReport: aidesReport, calculerReport: calculerReport,
    // « Et chez moi, en plus ? » : bloc « gestes » (29/09/2026)
    scenariosGestes: scenariosGestes, resumeGestes: resumeGestes, gestesImmeuble: gestesImmeuble, tresorerieSeule: tresorerieSeule,
    // collectif
    fluxCollectifs: fluxCollectifs, pvCollective: pvCollective, sortiesCollectives: sortiesCollectives, calculerTout: calculerTout,
    // résumé et autotest
    resume: resume, autotest: autotest,
  };

he de votre logement s'affiche. Rien n'est envoy\xE9"+r+": vos r\xE9ponses restent sur cet appareil.",entrees:{lot:"Le num\xE9ro de lot est sur vos appels de charges et dans votre acte de propri\xE9t\xE9. La fiche calcule alors votre part exacte, r\xE9solution par r\xE9solution.",etage:"Dites votre all\xE9e et votre \xE9tage"+r+": la liste donne les appartements de l'\xE9tage, avec les tanti\xE8mes \xE9crits sur votre appel de charges (sur 10"+r+"000). Deux appartements d'un m\xEAme \xE9tage peuvent avoir les m\xEAmes tanti\xE8mes"+r+": le montant est alors le m\xEAme.",type:"Sans num\xE9ro de lot, la fiche prend les tanti\xE8mes de r\xE9f\xE9rence du dossier pour votre type (les m\xEAmes que le rapport p. 7). Un doute"+r+"? Votre type figure sur votre dernier appel de charges, ou dans le plan de financement joint \xE0 la convocation."},alleeAide:"Votre all\xE9e, si vous la connaissez"+r+": les interphones et leur platine (r\xE9solutions 12 \xE0 14) ne sont r\xE9partis que sur les all\xE9es 61 et 67.",annexesAide:"Le propri\xE9taire paie aussi pour ses lots annexes, sur les travaux r\xE9partis en charges g\xE9n\xE9rales. Chaque appartement a une cave"+r+": elle est compt\xE9e. Un garage ou un parking se compte en plus, si vous en avez.",statut:{occupant:"La fiche parle de vous"+r+": ce que vous payez et ce que vous \xE9conomisez.",bailleur:"La fiche compte les travaux pour vous"+r+"; le chauffage est dans les charges de votre locataire. L'\xE9co-pr\xEAt \xE0 taux z\xE9ro collectif suppose un logement en r\xE9sidence principale (la v\xF4tre ou celle de votre locataire)"+r+": la situation exacte des bailleurs est demand\xE9e \xE0 OPERENE et \xE0 la banque.",locataire:"Les travaux ne sont pas \xE0 votre charge"+r+": la fiche montre ce que paie le propri\xE9taire, et ce qui change pour vous (chauffage, confort)."},depart:"la base et les trois options, pay\xE9es \xE0 cr\xE9dit avec les pr\xEAts pr\xE9vus par la copropri\xE9t\xE9, aux montants de la convocation. Vous pourrez changer chaque r\xE9glage dans la fiche, en un geste.",departNote:"C'est le r\xE9glage de d\xE9part de tout le dossier (d\xE9pliant, rapport, cube)"+r+": il ne recommande rien.",chapeauFiche:"Estimation du conseil syndical avec les chiffres de la convocation, r\xE9solution par r\xE9solution, avec les cl\xE9s de r\xE9partition qui y sont \xE9crites. Montants arrondis"+r+": touchez un chiffre soulign\xE9 pour le voir au centime pr\xE8s.",alerteExemple:"Vous n'avez pas encore choisi votre logement"+r+": la fiche montre un T3 \xE0 titre d'exemple.",alerteLocataire:"Vous \xEAtes locataire"+r+": les travaux sont \xE0 la charge du propri\xE9taire. Ce qui vous concerne"+r+": le chauffage (compris dans vos charges), le confort pendant et apr\xE8s le chantier, et l'enqu\xEAte sociale si elle vous est transmise. Les montants ci-dessous sont ceux de votre propri\xE9taire.",alerteNonHabitable:"Ce lot n'est pas un appartement"+r+": la fiche calcule sa part des travaux, mais pas l'\xE9nergie ni le bilan sur 25 ans, qui supposent un logement chauff\xE9. Pour un appartement, indiquez son num\xE9ro de lot.",prixAide:"tous frais compris"+r+": travaux, al\xE9as de 5"+r+"%, ma\xEEtrise d'\u0153uvre, syndic, assurance dommages-ouvrage, SPS, contr\xF4le technique, AMO. Les ratios lus ailleurs comptent rarement tout cela.",moisAide:"Mensualit\xE9 moyenne pendant les remboursements, aides d\xE9duites et frais compris"+r+": \xE9co-pr\xEAt \xE0 taux z\xE9ro collectif (20 ans) et pr\xEAt collectif Copro 100 (20 ans), avec l'avance de subvention les 18 premiers mois. Les pr\xEAts sont souscrits par la copropri\xE9t\xE9"+r+": chacun rembourse sa part dans ses charges, sans dossier bancaire individuel.",moisBailleur:"Si l'\xE9co-pr\xEAt \xE0 taux z\xE9ro ne s'applique pas \xE0 votre bien, sa part passe au pr\xEAt collectif Copro 100"+r+":",comptantAide:"Vous ne contractez aucun pr\xEAt"+r+": aucun int\xE9r\xEAt, aucune assurance de pr\xEAt.",appelsAide:"Deux appels de fonds du syndic (r\xE9solution 26), le 1er juillet 2027 et le 1er octobre 2027 (r\xE9ponse du syndic du 27/10)"+r+"; deux moiti\xE9s \xAB \xE0 confirmer \xBB, tant que la r\xE9partition n'est pas \xE9crite. Deux lectures de la convocation sont possibles"+r+": la r\xE9solution 31 fait verser \xAB les quotes-parts de d\xE9penses non subventionn\xE9es \xBB (aides d\xE9duites, pr\xE9financ\xE9es par la copropri\xE9t\xE9)"+r+"; la r\xE9solution 27 cr\xE9dite les aides sur les comptes individuels apr\xE8s les travaux (appels sur la quote-part brute, aides rendues ensuite). La fiche montre les deux.",postesAide:"Chaque r\xE9solution de la convocation a sa cl\xE9 de r\xE9partition"+r+": charges g\xE9n\xE9rales (fa\xE7ades, caves, zinguerie, balconnets, portes, \xE9clairages, toiture, locaux v\xE9los), habitation hors garages (garde-corps, d\xE9samiantage, ventilation, occultations), chauffage (chaufferie, robinets), all\xE9es 61 et 67 (interphones et platines). La ma\xEEtrise d'\u0153uvre et le syndic suivent la cl\xE9 de chaque r\xE9solution"+r+"; l'assurance dommages-ouvrage, les frais fixes et le syndic sur les frais sont en charges g\xE9n\xE9rales.",provisionsAide:"Deux provisions de l'avant-projet (isolation des embrasures avec les brise-soleil, d\xE9senfumage avec la toiture) sont compt\xE9es dans le rapport et le d\xE9pliant d\xE9j\xE0 distribu\xE9s, mais la convocation ne les vote pas"+r+": la fiche les montre \xE0 part et ne les ajoute pas au total.",aidesCollectives:"Collectives (MaPrimeR\xE9nov' Copropri\xE9t\xE9, \xC9cor\xE9no'v, primes \xE9nergie)"+r+": demand\xE9es par la copropri\xE9t\xE9, vers\xE9es apr\xE8s les travaux, r\xE9parties bloc par bloc avec la cl\xE9 des travaux de chaque bloc (r\xE9solution 04, tableau d'OPERENE sur devis). Elles ne sont pas garanties"+r+": MaPrimeR\xE9nov' exige un gain d'\xE9nergie d'au moins 35"+r+"%.",aidesIndividuelles:"Individuelles"+r+": des primes selon les revenus du foyer peuvent s'ajouter. Elles ne sont pas dans ces chiffres (0 ici, selon vos revenus"+r+": voir votre plan OPERENE)"+r+": l'enqu\xEAte sociale d'OPERENE les ouvre, et votre plan de financement individuel les \xE9crit.",energieNote:"Calcul r\xE9glementaire pour tout l'immeuble (m\xE9thode du DPE), gain certifi\xE9 par le dossier pour la base et pour la base avec les trois options. Votre facture d\xE9pend de votre usage et du prix du gaz"+r+": le cube montre \xAB ce que je paie par mois \xBB ann\xE9e par ann\xE9e, avec sa fourchette.",cheminsAide:"Trois chemins, toujours pr\xE9sent\xE9s ensemble et dans le m\xEAme ordre, calcul\xE9s par le moteur du cube pour votre logement et vos r\xE9glages (le calcul central"+r+": chaque hypoth\xE8se \xE0 sa valeur la plus probable). \xAB Par mois \xBB compte tout"+r+": charges courantes, entretien, chauffage et \xE9nergie, remboursements, appels de fonds.",cheminsNote:"Le confort n'est pas en euros"+r+": il a sa propre grille, dans le cube. Le bilan \xAB si je revends \xBB suit la convention du dossier"+r+": ce que j'ai pay\xE9 et le capital restant d\xFB, moins les aides, les \xE9conomies de chauffage et la plus-value estim\xE9e. Ces chiffres du cube comptent la quote-part avec les conventions du rapport (provisions de l'avant-projet comprises)"+r+": voir \xAB comment c'est calcul\xE9 \xBB.",incertitude:"Les chiffres ci-dessus sont le cas le plus probable. Le prix du gaz, le prix des travaux, les aides et les pannes peuvent bouger"+r+": la fourchette donn\xE9e ici ne fait varier que le prix du gaz, entre les deux bornes du dossier. Le cube calcule l'ensemble des avenirs possibles (la fourchette o\xF9 tombent 9 avenirs sur 10) pour chacun des trois chemins, sans en classer aucun.",scenarios:{V26:"Chantier en 2027 et 2028. Pr\xEAts d\xE8s 2027. Aides de 2026.",VPT:"Par convention en 2031"+r+": chantier en 2032 et 2033, aux prix de 2031. Aides non garanties.",SSP:"On r\xE9pare quand il faut, sans aide"+r+": toit, chaudi\xE8res, puis le reste, par morceaux."},faq:[{q:"Je paie comptant"+r+": combien, et quand"+r+"?",r:"Vous ne contractez aucun pr\xEAt, donc ni int\xE9r\xEAts ni assurance. Vous versez votre part aux deux appels de fonds du 1er juillet et du 1er octobre 2027"+r+"; les aides, vers\xE9es \xE0 la copropri\xE9t\xE9 apr\xE8s les travaux, viennent en d\xE9duction (r\xE9solutions 27 et 31). Faites glisser \xAB Part pay\xE9e comptant \xBB"+r+": de 0 \xE0 100"+r+"%, une partie comptant et le reste \xE0 cr\xE9dit, c'est possible.",ancre:"q44"},{q:"Les montants par mois s'ajoutent-ils \xE0 mes charges actuelles"+r+"?",r:"Oui. La mensualit\xE9 est une moyenne pendant les ann\xE9es de remboursement, aides d\xE9duites, en plus des charges actuelles"+r+"; elle est un peu plus \xE9lev\xE9e les 18 premiers mois (avance des aides), puis stable : les deux pr\xEAts durent 20 ans. L'\xE9conomie de chauffage vient en face \xE0 partir de la fin du chantier (2029 par convention)"+r+": la carte \xAB Sur 25 ans \xBB et le cube la montrent ann\xE9e par ann\xE9e.",ancre:"q20"},{q:"Comment ma quote-part est-elle calcul\xE9e"+r+"? Pourquoi n'est-elle pas proportionnelle \xE0 ma surface"+r+"?",r:"Chaque r\xE9solution de la convocation est r\xE9partie selon les tanti\xE8mes du r\xE8glement de copropri\xE9t\xE9, avec la cl\xE9 qu'elle nomme"+r+": charges g\xE9n\xE9rales, habitation hors garages, chauffage, all\xE9es pour les interphones. Les tanti\xE8mes datent de 1969 et ne suivent pas exactement les surfaces"+r+": deux logements de m\xEAme surface peuvent avoir des quotes-parts un peu diff\xE9rentes. Le tableau \xAB R\xE9solution par r\xE9solution \xBB donne chaque ligne.",ancre:"q16"},{q:"Mes caves, mon garage"+r+": paient-ils aussi"+r+"?",r:"Les travaux r\xE9partis en charges g\xE9n\xE9rales (fa\xE7ades, toiture, portes, \xE9clairages, locaux v\xE9los) p\xE8sent sur tous les lots qui ont des tanti\xE8mes g\xE9n\xE9raux, garages et parkings compris"+r+"; ceux de la cl\xE9 habitation (occultations, ventilation, garde-corps) et de la cl\xE9 chauffage ne p\xE8sent pas sur les garages et parkings. La fiche compte votre cave par d\xE9faut et vos garage ou parking si vous les cochez.",ancre:"q19"},{q:"J'ai d\xE9j\xE0 des robinets thermostatiques"+r+": dois-je payer l'option"+r+"?",r:"L'option (r\xE9solution 20) remplace les robinets et les t\xE9s de tous les radiateurs pour \xE9quilibrer le r\xE9seau avec les nouvelles chaudi\xE8res. Le syndic a r\xE9pondu le 27/10 qu'elle est r\xE9partie aux tanti\xE8mes"+r+"; le conseil syndical lui a redemand\xE9 le cas des logements d\xE9j\xE0 \xE9quip\xE9s. R\xE9ponse attendue avant le 19 novembre. Le r\xE9glage \xAB occultations et robinets \xBB montre les deux lectures.",ancre:"q28"},{q:"Les aides sont-elles garanties"+r+"? Quand sont-elles vers\xE9es"+r+"?",r:"Non"+r+": elles sont attribu\xE9es dans la limite des cr\xE9dits publics, apr\xE8s d\xE9p\xF4t d'un dossier complet, et vers\xE9es apr\xE8s les travaux. C'est pourquoi le dossier les affiche \xAB sans garantie \xBB, et pourquoi une avance de subvention est pr\xE9vue (r\xE9solution 31). MaPrimeR\xE9nov' Copropri\xE9t\xE9 exige au moins 35"+r+"% de gain d'\xE9nergie"+r+": la base en donne environ 41"+r+"% selon l'avant-projet.",ancre:"q39"},{q:"Je suis propri\xE9taire bailleur"+r+": qu'est-ce qui change"+r+"?",r:"Les travaux sont \xE0 votre charge"+r+"; le chauffage est dans les charges de votre locataire. L'\xE9co-pr\xEAt \xE0 taux z\xE9ro collectif suppose une r\xE9sidence principale (la v\xF4tre ou celle de votre locataire)"+r+": la fiche donne aussi la mensualit\xE9 sans \xE9co-pr\xEAt. Les aides collectives valent pour tous"+r+"; les primes individuelles d\xE9pendent de la situation du foyer.",ancre:"q101"},{q:"Pourquoi ces chiffres et ceux de mon plan de financement peuvent-ils diff\xE9rer"+r+"?",r:"Le plan d'OPERENE, joint \xE0 la convocation, est calcul\xE9 par OPERENE pour chaque logement. La fiche applique la convocation r\xE9solution par r\xE9solution avec les tanti\xE8mes de votre lot"+r+"; quelques conventions restent \xE0 faire \xE9crire (syndic sur les frais, interphones, occultations et robinets). En cas de diff\xE9rence, le plan d'OPERENE fait foi.",ancre:"q15"},{q:"Pourquoi ces chiffres sont-ils un peu plus bas que ceux du rapport et du d\xE9pliant"+r+"?",r:"Le rapport et le d\xE9pliant travaillent par type de logement moyen et comptent deux provisions de l'avant-projet (embrasures, d\xE9senfumage) que la convocation ne vote pas"+r+"; la fiche les montre \xE0 part. Ils r\xE9partissent aussi les interphones sur tout l'immeuble, alors que la convocation les met aux all\xE9es 61 et 67. Les deux restent des estimations"+r+"; la fiche suit la convocation au centime (tableau des \xE9carts dans \xAB comment c'est calcul\xE9 \xBB).",ancre:"q21"},{q:"O\xF9 est la partie financi\xE8re de l'\xE9tude du cabinet"+r+"?",r:"L'\xE9tude d'avril 2026 mise en ligne est la partie technique, sans prix"+r+": les montants d'avril sont d\xE9pass\xE9s. Les prix soumis au vote sont ceux de la convocation (rapport d'analyse des offres de septembre), repris ici et dans le rapport du conseil syndical.",ancre:"q9"}],faqPied:"Une autre question"+r+"? cslecallisto@gmail.com, la page \xAB Vos questions \xBB du site, ou la r\xE9union publique du jeudi 19 novembre \xE0 18"+r+"h (Salons d'Anatole), avec OPERENE, la ma\xEEtrise d'\u0153uvre, la banque et le syndic.",glossaire:{"quote-part":"Votre quote-part"+r+": votre part du co\xFBt total, calcul\xE9e avec les tanti\xE8mes de votre lot (les cl\xE9s de charges de la convocation). Elle comprend les travaux, les al\xE9as et les co\xFBts associ\xE9s"+r+": ma\xEEtrise d'\u0153uvre, contr\xF4le, assurance dommages-ouvrage, syndic, AMO.",tantiemes:"Les tanti\xE8mes"+r+": la part de votre lot dans l'immeuble, \xE9crite dans le r\xE8glement de copropri\xE9t\xE9 (sur 10"+r+"000 pour les charges g\xE9n\xE9rales). Chaque r\xE9solution de la convocation nomme sa cl\xE9"+r+": g\xE9n\xE9rales, habitation hors garages, chauffage, ou all\xE9e.",base:"La base"+r+": les travaux vot\xE9s d'un bloc (r\x <style>
.appbar{position:fixed;left:0;right:0;bottom:0;z-index:40;display:flex;justify-content:center;background:var(--accent);color:#fff;box-shadow:0 -4px 16px rgba(23,50,77,.22);padding-bottom:env(safe-area-inset-bottom,0px)}
.appbar ul{list-style:none;margin:0;padding:0;display:flex;width:100%;max-width:720px}
.appbar li{flex:1 1 0;min-width:0}
.appbar a{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;min-height:var(--barre-h);padding:7px 2px 6px;color:#dbe4ef;text-decoration:none;font-size:11px;font-weight:600;letter-spacing:.01em;white-space:nowrap}
.appbar a svg{width:22px;height:22px;stroke-width:1.9}
.appbar a[aria-current="page"]{color:var(--jaune)}
@media (max-width:399px){.appbar a{font-size:9.5px;letter-spacing:0;padding-inline:1px}}
@media (max-width:349px){.appbar a{font-size:9px;padding-inline:0}}
/* le raccourci mis en avant (l'avis anonyme) : son icône dans une pastille jaune */
.appbar a.fort{color:#fff}
.appbar a.fort svg{width:30px;height:30px;padding:5px;margin:-4px 0;border-radius:999px;background:var(--jaune);color:var(--accent);box-sizing:border-box}
.appbar a.fort[aria-current="page"]{color:var(--jaune)}
.appbar a:hover{color:#fff}
.appbar a:focus-visible{outline:3px solid var(--jaune);outline-offset:-3px;border-radius:10px}
@media (min-width:720px){.appbar{left:50%;right:auto;transform:translateX(-50%);width:min(720px,100%);border-radius:16px 16px 0 0}}
/* repliée (le simulateur) : un bouton rond en bas à droite ; touché, la barre se déplie */
.appbar.repliee{left:auto;right:12px;bottom:12px;width:auto;border-radius:999px;padding:0;transform:none;box-shadow:0 6px 18px rgba(23,50,77,.35)}
.appbar.repliee ul{display:none}
.appbar.repliee .deplier{display:flex}
.appbar .deplier{display:none;width:52px;height:52px;border:0;border-radius:999px;background:var(--accent);color:var(--jaune);align-items:center;justify-content:center;cursor:pointer}
.appbar .replier{display:none}
.appbar.depliable .replier{display:flex;position:absolute;right:6px;top:-42px;width:36px;height:36px;border:0;border-radius:999px;background:var(--accent);color:#fff;align-items:center;justify-content:center;cursor:pointer;box-shadow:0 4px 12px rgba(23,50,77,.3)}
.appbar.repliee .replier{display:none}
body.avec-barre{padding-bottom:calc(var(--barre-h) + 14px + env(safe-area-inset-bottom,0px))}
/* les tuiles de l'espace d'accueil */
.espace{display:flex;flex-direction:column;gap:14px}
.bandeau{background:var(--accent);color:#fff;border-radius:16px;padding:18px 18px 16px;display:flex;flex-direction:column;gap:6px;box-shadow:0 6px 18px rgba(23,50,77,.18);border-bottom:4px solid var(--jaune)}
.bandeau .sur{color:#dbe4ef}
.bandeau .salut{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:4px 12px;font-size:17px;font-weight:700;color:var(--jaune)}
.bandeau .salut span{min-width:0;overflow-wrap:anywhere}
.bandeau .salut button{min-height:44px;border:0;background:none;color:#dbe4ef;font:inherit;font-size:14px;font-weight:600;text-decoration:underline;text-underline-offset:3px;cursor:pointer;padding:0 2px}
.bandeau .salut button:hover{color:#fff}
.bandeau h2{margin:0;font-family:"Newsreader",Georgia,serif;font-weight:600;font-size:clamp(24px,5vw,32px);line-height:1.15}
.bandeau p{margin:0;color:#dbe4ef;font-size:15px}
.tuiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,300px),1fr));gap:12px}
.tuile{background:var(--surface);border:1px solid var(--trait);border-radius:16px;padding:14px 14px 14px;display:flex;flex-direction:column;gap:8px;min-width:0;scroll-margin-top:12px}
.tuile:hover{border-color:var(--accent-2)}
.tuile .haut{display:flex;align-items:center;gap:10px}
.tuile .picto{flex:none;width:44px;height:44px;border-radius:12px;background:var(--accent);color:var(--jaune);display:flex;align-items:center;justify-content:center}
.tuile .picto svg{width:26px;height:26px}
.tuile h3{margin:0;font-size:18px;line-height:1.2;color:var(--accent)}
.tuile p{margin:0;color:var(--encre-2);font-size:15px}
.tuile .actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:auto;padding-top:4px}
.tuile .bouton{min-height:42px;padding:8px 14px;font-size:15px}
.tuile.large{grid-column:1 / -1}
.panneau{display:flex;flex-direction:column;gap:10px;background:var(--surface-2);border:1px solid var(--trait);border-radius:12px;padding:12px}
.panneau[hidden]{display:none}
.courrier{margin:0;display:grid;grid-template-columns:auto 1fr;gap:4px 10px;font-size:14.5px}
.courrier dt{color:var(--doux);font-weight:700}
.courrier dd{margin:0;min-width:0;overflow-wrap:anywhere;user-select:all;-webkit-user-select:all}
#operene-texte{white-space:pre-wrap;user-select:text;-webkit-user-select:text}
/* la tuile mise en avant (l'avis anonyme) : le jaune de la charte, texte bleu nuit */
.tuile.fort{background:var(--jaune);border-color:var(--jaune);box-shadow:0 6px 18px rgba(23,50,77,.18)}
/* l'enquête sociale (A244) : recadrée de jaune, avec son échéance en pastille jaune */
.tuile.cadre-jaune{border:3px solid var(--jaune);box-shadow:0 6px 18px rgba(23,50,77,.14);position:relative}
.tuile.cadre-jaune .echeance{align-self:flex-start;background:var(--jaune);color:var(--accent);font-weight:800;font-size:13px;letter-spacing:.02em;border-radius:999px;padding:4px 12px}
.tuile.fort:hover{border-color:var(--accent)}
.tuile.fort p{color:var(--encre)}
.etapes{margin:0;padding-left:20px;color:var(--encre-2);font-size:15px;display:flex;flex-direction:column;gap:4px}
.dates{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));gap:10px}
.date{display:flex;gap:10px;align-items:center;background:var(--surface);border:1px solid var(--trait);border-radius:14px;padding:10px 12px}
.date .jour{flex:none;width:52px;height:52px;border-radius:10px;background:var(--jaune);color:var(--accent);display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:800;line-height:1}
.date .jour b{font-size:22px}
.date .jour small{font-size:10px;letter-spacing:.06em}
.date div{min-width:0;font-size:15px}
.date b.titre{display:block;color:var(--accent)}
.date .lieu{display:block;font-weight:600;margin:2px 0}
.date .lieu a{color:inherit;text-decoration:underline;text-underline-offset:2px}
.fait{display:inline-flex;align-items:center;gap:6px;background:#e6f4ea;color:#1b5e20;border-radius:999px;padding:6px 12px;font-size:14px;font-weight:600}
/* le teaser de l'inscription : un diaporama des aperçus, flouté, sous un cadenas */
.teaser{position:relative;border-radius:16px;overflow:hidden;background:var(--accent);aspect-ratio:16/9;max-height:320px;box-shadow:0 8px 24px rgba(23,50,77,.18)}
@media (max-width:520px){.teaser{aspect-ratio:4/3}}
.teaser img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:top;filter:blur(1.6px) brightness(.72) saturate(.9);opacity:0;animation:defile 20s infinite}
.teaser img:nth-child(1){animation-delay:0s}.teaser img:nth-child(2){animation-delay:5s}.teaser img:nth-child(3){animation-delay:10s}.teaser img:nth-child(4){animation-delay:15s}
@keyframes defile{0%{opacity:0}5%{opacity:1}25%{opacity:1}30%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){.teaser img{animation:none}.teaser img:nth-child(1){opacity:1}}
.teaser .cadenas{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:8px;color:#fff;text-align:center;padding:40px 16px 16px;text-shadow:0 1px 8px rgba(0,0,0,.6)}
.teaser .cadenas .rond{width:50px;height:50px;border-radius:999px;background:rgba(23,50,77,.75);border:2px solid var(--jaune);display:flex;align-items:center;justify-content:center;color:var(--jaune)}
.teaser .cadenas b{font-size:clamp(16px,3.6vw,22px);line-height:1.2;max-width:28ch;text-wrap:balance}
.teaser .cadenas span{font-size:13.5px;color:#e6edf5;max-width:34ch}
.teaser .legende{position:absolute;left:0;right:0;top:0;display:flex;gap:6px;justify-content:center;padding:8px;font-size:11px;color:#dbe4ef;background:linear-gradient(rgba(23,50,77,.7),transparent)}
.teaser .legende span{background:rgba(255,255,255,.16);border-radius:999px;padding:2px 9px}
